<style>
/* Local first brand type. It never phones home to Google, and it never
   breaks when there is no internet or no signal on a driver phone. Drop
   the two real font files into apps/shared/fonts/ to restore the exact
   brand type offline; see the README there. With no files present this
   falls back to the system font stack below. */
@font-face{font-family:'Anton'; font-weight:400; font-display:swap;
  src:local('Anton'), url('../shared/fonts/Anton-Regular.woff2') format('woff2'), url('../shared/fonts/Anton-Regular.ttf') format('truetype');}
@font-face{font-family:'Inter'; font-weight:100 900; font-display:swap;
  src:local('Inter'), url('../shared/fonts/Inter-Variable.woff2') format('woff2'), url('../shared/fonts/Inter-Variable.ttf') format('truetype');}
:root{
  --font-display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --ink:#131311; --panel:#1d1d19; --line:#2c2c27; --bone:#F4F4F1; --dim:#a6a69f;
  --green:#3AAA35; --orange:#F7941D; --red:#e0483e;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--ink); color:var(--bone); font-family:var(--font-body);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.01em; font-weight:400;}
::selection{background:var(--orange); color:var(--ink);}

header{
  background:var(--ink); border-bottom:1px solid var(--line); padding:8px 16px;
  display:flex; align-items:center; gap:10px;
}
header img{width:26px; height:26px; object-fit:contain; flex:none;}
header h1{font-size:15px; flex:1;}
.sync-badge{font-size:10px; padding:4px 8px; border-radius:20px; border:2px solid var(--line); color:var(--dim); flex:none; display:flex; align-items:center; gap:5px; white-space:nowrap;}
.sync-dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex:none;}
.sync-badge.offline{color:var(--orange); border-color:var(--orange);}
.sync-badge.offline .sync-dot{background:var(--orange);}

.banner-example{background:rgba(247,148,29,0.12); border-bottom:1px solid var(--orange); color:var(--orange); font-size:11px; font-weight:600; padding:5px 16px; text-align:center;}
.banner-stale{background:var(--panel); border-bottom:1px solid var(--line); color:var(--dim); font-size:11px; padding:5px 16px; text-align:center;}

.grid{
  display:grid; gap:10px; padding:10px;
  grid-template-columns: 1.15fr 1fr 1fr;
  grid-template-rows: auto auto auto auto auto;
}
.panel{background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; display:flex; flex-direction:column;}
.panel h2{font-size:11px; color:var(--dim); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px; flex:none;}
.panel-scroll{overflow-y:auto;}

/* bars */
.bar-row{margin-bottom:7px;}
.bar-row:last-child{margin-bottom:0;}
.bar-top{display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px;}
.bar-top .lab{font-weight:700; letter-spacing:0.02em;}
.bar-top .val{color:var(--dim);}
.bar{position:relative; height:16px; background:var(--line); border-radius:3px; overflow:hidden;}
.bar-fill{height:100%; border-radius:3px; background:var(--green); min-width:2px;}
.bar-fill.orange{background:var(--orange);}
.bar-fill.red{background:var(--red);}
.bar-fill.dim{background:#4a4a42;}

.big-num{font-family:var(--font-display); font-size:clamp(30px,4vw,44px); line-height:1; letter-spacing:0.01em;}
.big-sub{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

.verdict{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; padding:1px 7px; border-radius:20px; display:inline-block;}
.verdict.green{color:var(--green); border:2px solid var(--green);}
.verdict.orange{color:var(--orange); border:2px solid var(--orange);}
.verdict.red{color:var(--red); border:2px solid var(--red);}

.stack-bar{display:flex; height:26px; border-radius:4px; overflow:hidden; background:var(--line); margin-bottom:6px;}
.stack-seg{height:100%;}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:10px; color:var(--dim);}
.legend span.dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:-1px;}

.who-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:11px;}
.who-row:last-child{border-bottom:none;}
.who-name{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.who-age-bar{width:60px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:none;}
.who-age-fill{height:100%; background:#4a4a42;}
.who-age-fill.red{background:var(--red);}
.who-amt{flex:none; color:var(--dim); width:74px; text-align:right;}

.item-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:11px;}
.item-row:last-child{border-bottom:none;}
.item-name{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.empty-note{font-size:11px; color:var(--dim); padding:4px 0;}

@media(max-width:900px){
  .grid{grid-template-columns:1fr; grid-template-rows:none;}
  /* An inline grid-column written by the renderer beats this stylesheet, so at
     phone width every panel is forced back into the one column that exists.
     Without this the page scrolls sideways and whole panels sit off the edge. */
  .grid > *{grid-column:1 / -1 !important; grid-row:auto !important;}
  html,body{max-width:100%; overflow-x:hidden;}
  body{overflow-y:auto;}
}

/* Brick 57, the score ring: docs/DESIGN-LANGUAGE.md, the one thing she reads first */
.ring-card{grid-column:1 / -1;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-radius:22px;padding:16px 18px;background:rgba(8,28,20,.40);border:2px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 22px 54px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12)}
.ring-wrap{position:relative;width:196px;height:196px;flex:none}
.ring-wrap svg{display:block;width:196px;height:196px}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-mid .n{font-size:46px;font-weight:800;line-height:1;color:#F4F7F5;letter-spacing:-1px}
.ring-mid .n.unknown{font-size:22px;line-height:1.2;max-width:130px}
.ring-mid .o{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#A7B5AE;margin-top:5px}
.ring-mid .v{font-size:12px;font-weight:800;margin-top:7px;max-width:132px;line-height:1.25}
.ring-side{flex:1;min-width:240px}
.ring-side .t{font-size:15px;font-weight:800;color:#F4F7F5}
.ring-side .w{font-size:12.4px;color:#C9D6CF;margin-top:3px}
.ring-rows{margin-top:11px}
.rr{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.rr .rl{font-size:12.4px;font-weight:800;color:#F4F7F5;width:92px;flex:none}
.rr .rb{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.rr .rb i{display:block;height:100%;border-radius:6px}
.rr .rb.unknown{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.rr .rv{font-size:11.5px;font-weight:800;color:#C9D6CF;width:66px;text-align:right;flex:none}
.rr .rs{font-size:11.6px;color:#A7B5AE;margin-left:2px}
.rr-say{font-size:11.8px;color:#C9D6CF;margin:0 0 4px 102px;line-height:1.3}
.ring-act{display:inline-flex;align-items:center;gap:9px;margin-top:12px;background:#F7941D;color:#fff;border:0;border-radius:999px;font-weight:800;font-size:13px;padding:10px 17px;cursor:pointer;text-decoration:none;box-shadow:0 10px 24px -10px rgba(247,148,29,.9)}
.ring-act svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ring-quiet{display:inline-block;margin-top:12px;font-size:12px;font-weight:800;color:#8FE08A;background:rgba(58,170,53,.16);border:2px solid rgba(58,170,53,.4);border-radius:999px;padding:8px 15px}
.ring-foot{font-size:11.2px;color:#A7B5AE;margin-top:9px}
@media (max-width:720px){ .ring-card{gap:14px;justify-content:center} .ring-side{min-width:100%} .rr .rl{width:78px} .rr-say{margin-left:88px} }

/* Brick 61: the bell, same on every page */
.hdr-bell{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none;margin-left:8px}
.hdr-bell svg{width:18px;height:18px;stroke:#F4F7F5;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the four bands of the MD contract, brick 79 (md-console SKILL.md) ---------- */
.grid{display:block;padding:10px}
.band{border-radius:22px;padding:14px 16px;margin:0 0 12px;background:rgba(8,28,20,.40);border:2px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 22px 54px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12)}
.band-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.band-head h2{font-size:15px;font-weight:800;color:#F4F7F5;text-transform:none;letter-spacing:-.2px;margin:0}
.band-note{font-size:11px;font-weight:700;color:#FDBE74;text-align:right}
.band-honest{font-size:12px;line-height:1.45;color:#A7B5AE;margin-top:10px}
.band-lead{font-size:14px;font-weight:700;color:#8FE08A;margin:2px 0 8px}
.band-link{color:#FDBE74;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 4px}

.oh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.oh{grid-template-columns:repeat(3,minmax(0,1fr))}}
.oh-tile{display:block;min-width:0;text-decoration:none;color:inherit;border-radius:16px;padding:10px 12px;min-height:88px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14)}
.oh-k{font-size:11px;font-weight:800;letter-spacing:.3px;color:#A7B5AE;text-transform:uppercase}
.oh-v{font-size:clamp(18px,6vw,24px);font-weight:800;letter-spacing:-.6px;color:#F4F7F5;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.oh-v.none{font-size:13px;color:#A7B5AE;font-weight:700;margin-top:8px}
.oh-clock{font-size:11px;color:#C9D6CF;margin-top:3px;line-height:1.35}
.oh-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.oh-bar i{display:block;height:100%;border-radius:4px;background:#3AAA35}
.oh-bar i.amber{background:#F7941D} .oh-bar i.red{background:#FF6B61}

.nx{padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.nx:first-of-type{border-top:0}
.nx-who{font-size:12px;color:#A7B5AE} .nx-who b{color:#F4F7F5;font-size:15px}
.nx-ask{font-size:15px;font-weight:700;color:#F4F7F5;margin-top:2px;line-height:1.35}
.nx-because{font-size:13px;color:#C9D6CF;line-height:1.4}
.nx-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;font-family:inherit;background:rgba(255,255,255,.08);color:#F4F7F5;border:2px solid rgba(255,255,255,.26)}
.nx-btn.primary{background:#fff;color:#0E2F22;border-color:#fff}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk-day{border-radius:12px;padding:6px 3px;background:rgba(255,255,255,.05);min-height:64px;min-width:0;overflow-wrap:anywhere}
.wk-day.today{outline:2px solid #F7941D;outline-offset:-2px}
.wk-d{font-size:10px;color:#A7B5AE;text-align:center;font-weight:700} .wk-d b{display:block;font-size:14px;color:#F4F7F5}
.wk-none{height:8px}
.wk-it{display:block;text-decoration:none;color:#F4F7F5;font-size:10px;line-height:1.25;border-radius:8px;padding:6px 4px;margin-top:4px;min-height:44px;background:rgba(58,170,53,.22)}
.wk-it.amber{background:rgba(247,148,29,.22)} .wk-it.red{background:rgba(255,107,97,.22)}

.co-mapcard{display:block;text-decoration:none;color:inherit;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12)}
.co-map{display:block;width:100%;height:auto}
.co-say{font-size:12px;color:#C9D6CF;padding:8px 12px 10px;line-height:1.4}
.co-people{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
@media(min-width:700px){.co-people{grid-template-columns:repeat(2,minmax(0,1fr))}}
.co-dept{display:flex;flex-direction:column;justify-content:center;min-height:56px;min-width:0;overflow-wrap:anywhere;text-decoration:none;color:inherit;border-radius:14px;padding:8px 12px;background:rgba(255,255,255,.06)}
.co-d{font-size:14px;font-weight:800;color:#F4F7F5} .co-d span{font-size:11px;color:#A7B5AE;font-weight:700;margin-left:6px}
.co-on{font-size:12px;color:#C9D6CF;margin-top:2px}

.ex{padding:8px 0}
.ex-top{display:flex;justify-content:space-between;font-size:13px;color:#F4F7F5;gap:10px;min-width:0} .ex-top b{color:#FDBE74;white-space:nowrap}
.ex-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.ex-bar i{display:block;height:100%;border-radius:5px;background:#3AAA35} .ex-bar i.amber{background:#F7941D} .ex-bar i.red{background:#FF6B61}
.ex-unread{font-size:12px;line-height:1.45;color:#C9D6CF;margin-top:8px} .ex-unread b{color:#FDBE74}
.ex-cite{font-size:11px;line-height:1.4;color:#A7B5AE;margin-top:5px;overflow-wrap:anywhere}

.pl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.pl{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pl-chip{display:block;min-width:0;text-decoration:none;color:inherit;border-radius:14px;padding:10px 12px;min-height:44px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14)}
.pl-n{font-size:22px;font-weight:800;color:#F4F7F5;line-height:1}
.pl-l{font-size:12px;font-weight:800;color:#FDBE74;margin-top:2px}
.pl-v{font-size:11px;color:#C9D6CF;margin-top:4px;line-height:1.35;overflow-wrap:anywhere}
</style>

<script>
const STAGES = ['new','contacted','replied','meeting','quoted','won','lost'];
const STAGE_LABEL = {new:'New', contacted:'Contacted', replied:'Replied', meeting:'Meeting', quoted:'Quoted', won:'Won', lost:'Lost'};
const JOB_STATUSES = ['booked','collected','in_transit','out_for_delivery','delivered','exception'];
const JOB_LABEL = {booked:'Booked', collected:'Collected', in_transit:'In transit', out_for_delivery:'Out for delivery', delivered:'Delivered', exception:'Exception'};
const JOB_COLOR = {booked:'#4a4a42', collected:'#3AAA35', in_transit:'#3AAA35', out_for_delivery:'#3AAA35', delivered:'#3AAA35', exception:'#e0483e'};

function pula(t){ const p=(Number(t||0)/100); const parts=p.toFixed(2).split('.'); parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' '); return 'P'+parts.join('.'); }
function localDT(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleString('en-GB',{timeZone:'Africa/Gaborone',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shiftDate(days){ const d=new Date(); d.setUTCDate(d.getUTCDate()+days); return d.toISOString(); }

let DATA=null, SYNCED_AT=null;
const CACHE_KEY='sprintos_cockpit_cache_v1';

const EXAMPLE = {
  pipeline: {
    new:{count:6, value_thebe:1180000}, contacted:{count:9, value_thebe:2140000}, replied:{count:4, value_thebe:930000},
    meeting:{count:3, value_thebe:1780000}, quoted:{count:5, value_thebe:1620000}, won:{count:2, value_thebe:264000}, lost:{count:3, value_thebe:190000}
  },
  quotes: {out:14, accepted:6, expiring7d:3},
  jobs_today: {booked:5, collected:3, in_transit:4, out_for_delivery:2, delivered:11, exception:1},
  on_time_rate_30d: 91,
  /* The money is NOT invented here any more. Four screens carried four figures
     for one fact, a factor of thirteen hundred apart, and the managing director
     opens two screens in her first five minutes. One set of facts lives in
     apps/shared/sprint-example.js and a test fails the build if a screen grows
     its own again. */
  cash: (window.SprintExample && window.SprintExample.cash) || {},
  /* Brick 103: one shared record, so this board and the Tender Desk and Home all
     count down to the same instant. days_left is derived, never typed beside a
     date that can drift away from it. */
  tenders: (window.SprintExample ? window.SprintExample.tenders() : []).slice(0, 4).map(function (t) {
    return {issuer:t.issuer, title:t.title, closes_at:t.closes_at,
            days_left: Math.floor(t.closes_in_minutes / 1440)};
  }),
  documents_with_expiry_total: 9,
  incidents_recorded_total: 4,
  documents_expiring: [
    {name:'EXAMPLE trade licence', expires_at: shiftDate(-41), days_left:-41, owner:'EXAMPLE Owner'},
    {name:'Fleet insurance certificate', expires_at: shiftDate(18), days_left:18, owner:'Ops Desk'},
    {name:'Tax clearance certificate', expires_at: shiftDate(45), days_left:45, owner:'Accounts'},
    {name:'BOCRA operating licence', expires_at:'2028-08-22T00:00:00.000Z', days_left:700, owner:'Barbara'},
  ],
  open_incidents: [
    {id:'inc_example_1', title:'EXAMPLE: vehicle overturned on the A1', type:'vehicle_accident', severity:4, status:'recovering', opened_at: shiftDate(0)}
  ],
  fleet_alerts: [
    {kind:'fuel', reg:'EXAMPLE-B456ABC', label:'EXAMPLE-B456ABC: worth a question'},
    {kind:'service', reg:'EXAMPLE-B456ABC', label:'EXAMPLE-B456ABC: service overdue'}
  ]
};

// Sprint Pulse (decision #48) example fallback: two roles below the named
// individuals headcount floor (a two person pilot must never show a ranked
// bottom or a permanent runner up), team totals only.
const PULSE_EXAMPLE = {
  period: 'week',
  since: shiftDate(-6).slice(0,10),
  roles: [
    { role:'driver', headcount:2, named_individuals:false, top:[], team_total_points:19,
      note:'Fewer than 5 scored people in this role this period; showing the team total only, never an individual ranking that would produce a permanent runner up.' },
    { role:'ops', headcount:1, named_individuals:false, top:[], team_total_points:6,
      note:'Fewer than 5 scored people in this role this period; showing the team total only, never an individual ranking that would produce a permanent runner up.' }
  ],
  team_goal: { metric:'on_time_rate', threshold_pct:95, value_pct:91, met:false, judged_deliveries:22 }
};

async function apiFetch(path){
  const res = await fetch(path, {credentials:'include'});
  let json; try{ json = await res.json(); }catch(e){ json={ok:false, error:'Bad response'}; }
  if(!json.ok){ throw new Error(json.error || ('HTTP '+res.status)); }
  return json.data;
}

async function loadLive(){
  try{
    const cockpit = await apiFetch('/api/cockpit');
    DATA = Object.assign({live:true}, cockpit);
    SYNCED_AT = new Date().toISOString();
    localStorage.setItem(CACHE_KEY, JSON.stringify({data:cockpit, at:SYNCED_AT}));
    render();
  }catch(e){ loadFallback(); }
}
function loadFallback(){
  const cached = localStorage.getItem(CACHE_KEY);
  if(cached){
    try{ const parsed=JSON.parse(cached); DATA=Object.assign({live:false, cached:true}, parsed.data); SYNCED_AT=parsed.at; render(); return; }catch(e){}
  }
  DATA = Object.assign({example:true}, EXAMPLE);
  SYNCED_AT = null;
  render();
}

function updateSyncBadge(){
  const badge=document.getElementById('syncBadge'), text=document.getElementById('syncText');
  if(DATA.example){ badge.classList.add('offline'); text.textContent='Offline'; }
  else if(DATA.live){ badge.classList.remove('offline'); text.textContent='Synced now'; }
  else if(SYNCED_AT){ badge.classList.add('offline'); text.textContent='Synced '+localDT(SYNCED_AT); }
  else { badge.classList.add('offline'); text.textContent='Offline'; }
}

function verdictFor(pct, goodAt, okAt){
  if(pct>=goodAt) return 'green'; if(pct>=okAt) return 'orange'; return 'red';
}


/* ---------- Brick 57: the score ring ----------
   Five things the MD can act on. Every one scores itself from the cockpit's own
   live payload, and every one is allowed to say it does not know. The middle
   number is the average of the KNOWN parts only; an unmeasured part is never
   counted as zero, because a zero is a claim (feedback_never_print_unproven_zero). */
function ringPolar(cx, cy, r, deg){ var a = (deg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function ringArc(cx, cy, r, a0, a1){
  var p0 = ringPolar(cx, cy, r, a0), p1 = ringPolar(cx, cy, r, a1);
  return 'M ' + p0.x.toFixed(2) + ' ' + p0.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2);
}
function ringColour(s){ return s >= 85 ? '#3AAA35' : s >= 60 ? '#F7941D' : '#FF6B61'; }
function scoreParts(){
  var parts = [];
  var d = DATA || {};

  // 1. The promise: deliveries that arrived by the time promised, 30 days.
  var otr = d.on_time_rate_30d;
  if (otr === null || otr === undefined) {
    parts.push({ key:'ontime', label:'On time', known:false, why:'No delivery in the last 30 days carries both a promised time and a delivered time, so the promise cannot be judged.', owner:'Operations, at booking' });
  } else {
    parts.push({ key:'ontime', label:'On time', known:true, score:Math.max(0, Math.min(100, otr)), shown:Math.round(otr) + '%',
      say:otr >= 95 ? 'Better than the 95 percent the team is aiming at.' : otr >= 85 ? 'Holding, but under the 95 percent target.' : 'Under target. Late parcels are the fastest way to lose a corporate account.',
      href:'../ops/index.html' });
  }

  // 2. The money: how much of what is owed is current rather than overdue.
  var cash = d.cash || {};
  var paid = Number(cash.paid_30d_thebe || 0), over = Number(cash.overdue_thebe || 0);
  if (paid + over === 0) {
    parts.push({ key:'money', label:'Money in', known:false, why:'No invoice was paid or fell overdue in the period, so there is nothing to measure yet.', owner:'Accounts' });
  } else {
    var pct = paid / (paid + over) * 100;
    var worst = (cash.overdue_by_customer || [])[0];
    parts.push({ key:'money', label:'Money in', known:true, score:pct, shown:Math.round(pct) + '%',
      say:over === 0 ? 'Nothing overdue.' : pula(over) + ' is overdue' + (worst ? ', the largest being ' + worst.customer + '.' : '.'),
      href:'../accounts/index.html' });
  }

  // 3. Today's run: jobs booked today that have not gone wrong.
  var jt = d.jobs_today || {};
  var total = JOB_STATUSES.reduce(function(a, s){ return a + (jt[s] || 0); }, 0);
  if (total === 0) {
    parts.push({ key:'today', label:'Today', known:false, why:'Nothing has been booked today yet, so there is no run to judge.', owner:'Operations' });
  } else {
    var bad = jt.exception || 0;
    var s3 = (total - bad) / total * 100;
    parts.push({ key:'today', label:'Today', known:true, score:s3, shown:(jt.delivered || 0) + ' of ' + total,
      say:bad ? bad + (bad === 1 ? ' job has' : ' jobs have') + ' gone to exception today.' : 'Every job booked today is still running clean.',
      href:'../ops/index.html' });
  }

  // 4. The paperwork. An empty list only means "all current" if the hub has
  //    documents with expiry dates at all; otherwise nothing is being watched.
  var docs = d.documents_expiring || [];
  var watched = d.documents_with_expiry_total;
  if (watched === 0 || (watched === undefined && docs.length === 0)) {
    parts.push({ key:'papers', label:'Paperwork', known:false, why:'No company document has an expiry date recorded, so nothing is being watched. An expired operating licence would not show here.', owner:'Barbara' });
  } else {
    var expired = docs.filter(function(x){ return x.days_left < 0; });
    var soon = docs.filter(function(x){ return x.days_left >= 0 && x.days_left <= 60; });
    var s4 = expired.length ? Math.max(0, 40 - expired.length * 15) : soon.length ? Math.max(60, 100 - soon.length * 12) : 100;
    var lead = expired[0] || soon[0];
    parts.push({ key:'papers', label:'Paperwork', known:true, score:s4,
      shown:expired.length ? expired.length + ' expired' : soon.length ? soon.length + ' near' : 'all current',
      say:expired.length ? lead.name + ' ran out ' + Math.abs(lead.days_left) + ' days ago. Owner ' + (lead.owner || 'not named') + '.'
        : soon.length ? lead.name + ' runs out in ' + lead.days_left + ' days. Owner ' + (lead.owner || 'not named') + '.'
        : 'Nothing on the wall runs out inside 60 days.' });
  }

  // 5. Incidents still open, weighted by how bad each one is.
  var inc = d.open_incidents || [];
  var everRecorded = d.incidents_recorded_total;
  if (!inc.length && everRecorded === 0) {
    // An empty desk is not a safe fleet. Nobody has ever reported anything, so
    // silence here means the reporting is not running, not that nothing went wrong.
    parts.push({ key:'incidents', label:'Incidents', known:false, why:'No incident has ever been recorded on the desk, so silence here means nothing is being reported rather than nothing going wrong.', owner:'Operations' });
  } else if (!inc.length) {
    parts.push({ key:'incidents', label:'Incidents', known:true, score:100, shown:'none open', say:'Nothing open on the Incident Desk.', href:'../incidents/index.html' });
  } else {
    var cost = inc.reduce(function(a, i){ return a + (Number(i.severity) || 1) * 12; }, 0);
    var top = inc.slice().sort(function(a, b){ return (b.severity || 0) - (a.severity || 0); })[0];
    parts.push({ key:'incidents', label:'Incidents', known:true, score:Math.max(0, 100 - cost), shown:inc.length + ' open',
      say:String(top.title || 'An incident').replace(/^EXAMPLE:\s*/, 'EXAMPLE ') + ', severity ' + top.severity + ', ' + top.status + '.',
      href:'../incidents/index.html' });
  }
  return parts;
}
function ringHtml(){
  var parts = scoreParts();
  var known = parts.filter(function(p){ return p.known; });
  // A score needs a quorum. With fewer than three of the five parts sourced,
  // an average says more about what is missing than about the business, and a
  // high number built on one part is the most dangerous thing on this screen.
  var QUORUM = 3;
  var avg = known.length >= QUORUM ? Math.round(known.reduce(function(a, p){ return a + p.score; }, 0) / known.length) : null;
  var worst = known.slice().sort(function(a, b){ return a.score - b.score; })[0];
  var reds = known.filter(function(p){ return p.score < 60; }).length;
  var ambers = known.filter(function(p){ return p.score >= 60 && p.score < 85; }).length;

  var cx = 98, cy = 98, r = 80, seg = 360 / parts.length, gap = 5;
  var svg = ['<svg viewBox="0 0 196 196" xmlns="http://www.w3.org/2000/svg" aria-label="Score ring, ' + (avg === null ? 'nothing measured' : avg + ' out of 100') + '">'];
  parts.forEach(function(p, i){
    var a0 = i * seg + gap / 2, a1 = (i + 1) * seg - gap / 2;
    svg.push('<path d="' + ringArc(cx, cy, r, a0, a1) + '" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="15" stroke-linecap="round"' + (p.known ? '' : ' stroke-dasharray="3 7"') + '/>');
    if (p.known && p.score > 0) {
      var fill = a0 + (a1 - a0) * Math.max(0.02, Math.min(1, p.score / 100));
      svg.push('<path d="' + ringArc(cx, cy, r, a0, fill) + '" fill="none" stroke="' + ringColour(p.score) + '" stroke-width="15" stroke-linecap="round"/>');
    }
  });
  svg.push('</svg>');

  var verdict = avg === null ? (known.length ? 'Only ' + known.length + ' of ' + parts.length + ' parts have a source, which is too little to score.' : 'Nothing here has a source yet.')
    : reds ? (reds === 1 ? 'One thing needs you today.' : reds + ' things need you today.')
    : ambers ? (ambers === 1 ? 'One thing is slipping.' : ambers + ' things are slipping.')
    : 'Everything measured is on target.';
  var vcol = avg === null ? '#A7B5AE' : reds ? '#FFB3AD' : ambers ? '#FDBE74' : '#8FE08A';

  var rows = parts.map(function(p){
    if (!p.known) {
      return '<div class="rr" title="' + esc(p.why) + '"><span class="rl">' + esc(p.label) + '</span><span class="rb unknown"></span><span class="rv">not measured</span></div>' +
        '<div class="rr-say">' + esc(p.why) + ' Owner: ' + esc(p.owner || 'not named') + '.</div>';
    }
    var open = p.href ? ' onclick="location.href=\'' + p.href + '\'"' : '';
    return '<div class="rr"' + open + '><span class="rl">' + esc(p.label) + '</span><span class="rb"><i style="width:' + Math.max(3, Math.round(p.score)) + '%;background:' + ringColour(p.score) + '"></i></span><span class="rv">' + esc(p.shown) + '</span></div>' +
      '<div class="rr-say">' + esc(p.say) + '</div>';
  }).join('');

  var act = avg !== null && worst && worst.score < 85
    ? '<a class="ring-act"' + (worst.href ? ' href="' + worst.href + '"' : ' href="#" onclick="return false"') + '><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg>' + esc(worst.label === 'Money in' ? 'Chase the money' : worst.label === 'Paperwork' ? 'Fix the paperwork' : worst.label === 'Incidents' ? 'Open the Incident Desk' : worst.label === 'On time' ? 'See what ran late' : 'See today\u2019s run') + '</a>'
    : avg === null ? '<span class="ring-quiet" style="color:#FDBE74;background:rgba(247,148,29,.16);border-color:rgba(247,148,29,.45)">Get these connected before month end</span>'
    : '<span class="ring-quiet">Nothing needs you right now</span>';

  return '<div class="ring-card"><div class="ring-wrap">' + svg.join('') +
    '<div class="ring-mid">' + (avg === null ? '<div class="n unknown">Not enough<br>measured</div>' : '<div class="n">' + avg + '</div><div class="o">out of 100</div>') +
    '<div class="v" style="color:' + vcol + '">' + esc(verdict) + '</div></div></div>' +
    '<div class="ring-side"><div class="t">How Sprint is doing right now</div>' +
    '<div class="w">Five things you can do something about. The ring is the average of the ones that have a source.</div>' +
    '<div class="ring-rows">' + rows + '</div>' + act +
    '<div class="ring-foot">' + known.length + ' of ' + parts.length + ' measured' + (known.length < parts.length ? '. A part with no source is left grey and out of the average, never counted as zero' + (avg === null ? ', and below three sourced parts no score is shown at all' : '') + '.' : '.') + '</div></div></div>';
}

// ---------------------------------------------------------------------------
// The four bands of the MD contract (md-console SKILL.md), top to bottom, one screen:
//   1 OVERHEAD   six numbers, each carrying its own clock. No history yet, so each is honestly
//                a first reading rather than a trend somebody drew.
//   2 NEXT       three to five contact lines: who, the exact question, because, and a warm
//                draft that copies and never sends. This band is the reason the screen exists.
//   3 THE WEEK   seven days as a strip. Diary certainties only. One honest line says there is
//                no forecast, because there is no operating history to forecast from.
//   4 NOW        the map as permanent ground, then the departments as their people.
// Then the two October bands that disk data already supports (tools/build-cockpit-bands.py),
// and one honest line each for the two that must not be faked yet.
// Every target is 44 px, measured by hub/tests/touch-targets.test.js at 375 px.
// ---------------------------------------------------------------------------
let BANDS = null;          // apps/cockpit/bands.json, written by tools/build-cockpit-bands.py
let FLEET_LIVE = null;     // /api/fleet/live, or null when no vehicle has ever reported

async function loadBands(){
  try{ const r = await fetch('bands.json', {cache:'no-store'}); BANDS = r.ok ? await r.json() : null; }catch(e){ BANDS = null; }
  try{ FLEET_LIVE = await apiFetch('/api/fleet/live'); }catch(e){ FLEET_LIVE = null; }
}

const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function daysFrom(iso){ if(!iso) return null; const d=new Date(iso); if(isNaN(d)) return null; return Math.round((d - new Date())/86400000); }
function dayLabel(iso){ const d=new Date(iso); return DAY[d.getDay()]+' '+d.getDate(); }
function clockWord(){ return DATA.live ? 'as of now' : (SYNCED_AT ? 'as of '+localDT(SYNCED_AT) : 'example, no clock'); }
function firstName(s){ return String(s||'').replace(/^EXAMPLE\s+/i,'').split(/[\s,]+/)[0] || 'there'; }

// --- 1. overhead ------------------------------------------------------------
function overheadBand(){
  const cash = DATA.cash || {paid_30d_thebe:null, overdue_thebe:null, overdue_by_customer:[]};
  const jt = DATA.jobs_today || {};
  const out = (jt.in_transit||0) + (jt.out_for_delivery||0);
  const q = DATA.quotes || {};
  const inc = (DATA.open_incidents||[]).length;
  const otr = DATA.on_time_rate_30d;
  const tiles = [
    {k:'Money owed to Sprint', v: cash.overdue_thebe==null ? null : pula(cash.overdue_thebe), clock:'overdue today, '+clockWord(), share: cash.overdue_thebe && cash.paid_30d_thebe ? cash.overdue_thebe/(cash.overdue_thebe+cash.paid_30d_thebe) : null, tone:'red', href:'../accounts/index.html', why:'No invoice carries a due date yet. Owner: Accounts.'},
    {k:'Money in, 30 days', v: cash.paid_30d_thebe==null ? null : pula(cash.paid_30d_thebe), clock:'paid in the last 30 days', share: cash.paid_30d_thebe && cash.overdue_thebe ? cash.paid_30d_thebe/(cash.overdue_thebe+cash.paid_30d_thebe) : null, tone:'green', href:'../accounts/index.html', why:'No payment recorded yet. Owner: Accounts.'},
    {k:'On time, 30 days', v: otr==null ? null : Math.round(otr)+'%', clock:'of judged deliveries', share: otr==null ? null : otr/100, tone: otr>=95?'green':otr>=85?'amber':'red', href:'../ops/index.html', why:'No delivery in 30 days carries both a promised and a delivered time. Owner: Operations, at booking.'},
    {k:'Parcels on the road', v: out, clock:'right now, '+clockWord(), share: null, tone:'green', href:'../ops/index.html', why:''},
    {k:'Incidents open', v: inc, clock: inc ? 'now, oldest '+localDT((DATA.open_incidents[0]||{}).opened_at) : 'none open, '+clockWord(), share:null, tone: inc?'red':'green', href:'../incidents/index.html', why:''},
    {k:'Quotes expiring', v: q.expiring7d==null ? null : q.expiring7d, clock:'inside 7 days', share: q.out ? (q.expiring7d||0)/q.out : null, tone:'amber', href:'../sales/index.html', why:'No quote carries an expiry yet. Owner: Sales.'},
  ];
  let h = '<section class="band" id="band-overhead"><div class="band-head"><h2>Overhead</h2><span class="band-note">first reading, no earlier period on file yet</span></div><div class="oh">';
  tiles.forEach(t=>{
    const known = t.v!==null && t.v!==undefined;
    h += '<a class="oh-tile" href="'+t.href+'"><div class="oh-k">'+esc(t.k)+'</div>' +
      (known ? '<div class="oh-v">'+esc(t.v)+'</div>' : '<div class="oh-v none">no data yet</div>') +
      '<div class="oh-clock">'+esc(known ? t.clock : t.why)+'</div>' +
      (known && t.share!=null ? '<div class="oh-bar"><i class="'+t.tone+'" style="width:'+Math.max(3,Math.round(t.share*100))+'%"></i></div>' : '') +
      '</a>';
  });
  return h + '</div></section>';
}

// --- 2. next ------------------------------------------------------------------
function nextLines(){
  const lines = [];
  const tenders = (DATA.tenders||[]).filter(t=>t.days_left!=null).sort((a,b)=>a.days_left-b.days_left);
  if(tenders.length){
    const t = tenders[0];
    lines.push({who:'Barbara', ask:'where the '+t.issuer+' bid stands', because:'it closes in '+t.days_left+' day'+(t.days_left===1?'':'s')+(tenders.length>1?', and '+(tenders.length-1)+' more close inside '+tenders[tenders.length-1].days_left+' days':''),
      href:'../tenders/index.html', draft:'Hi Barbara, quick one. Where does the '+t.issuer+' bid stand? It closes in '+t.days_left+' days and I want to be sure nothing is waiting on me. Thank you.'});
  }
  const obc = ((DATA.cash||{}).overdue_by_customer||[]).slice().sort((a,b)=>b.days-a.days);
  if(obc.length){
    const o = obc[0];
    lines.push({who:'Accounts', ask:'to call '+o.customer.replace(/^EXAMPLE\s+/,'')+' today', because:pula(o.amount_thebe)+' is '+o.days+' days overdue'+(obc.length>1?', the oldest of '+obc.length:''),
      href:'../accounts/index.html', draft:'Hello '+firstName(o.customer)+', it is Sprint Couriers. Our records show '+pula(o.amount_thebe)+' outstanding for about '+o.days+' days. Could you let us know when we can expect it, or tell us if something on our side is holding it up? Thank you.'});
  }
  const docs = (DATA.documents_expiring||[]).filter(d=>d.days_left<=30).sort((a,b)=>a.days_left-b.days_left);
  if(docs.length){
    const d = docs[0];
    lines.push({who:d.owner||'Snowy', ask:'for the renewal of the '+d.name.replace(/^EXAMPLE\s+/,''), because: d.days_left<0 ? 'it expired '+Math.abs(d.days_left)+' days ago and a tender can be thrown out for it' : 'it runs out in '+d.days_left+' days',
      href:'../tenders/index.html', draft:'Hi '+firstName(d.owner)+', the '+d.name.replace(/^EXAMPLE\s+/,'')+(d.days_left<0?' has expired':' runs out in '+d.days_left+' days')+'. Could you send me the renewed copy, or tell me where it stands? Thank you.'});
  }
  const inc = DATA.open_incidents||[];
  if(inc.length){
    const i = inc[0];
    lines.push({who:'Operations', ask:'who is with '+i.title.replace(/^EXAMPLE:\s*/,'')+' and whether every customer on that manifest has been told', because:'it is open at severity '+i.severity+' and the customers find out from us or from nobody',
      href:'../incidents/index.html', draft:'Hi, it is Michelle. On the open incident, who is with the vehicle right now, and has every customer with a parcel on it been told? If not, please send me the list and I will help make the calls.'});
  }
  if(BANDS && BANDS.pipeline){
    const sig = BANDS.pipeline.chips.find(c=>c.label==='At signature');
    if(sig && sig.count){
      lines.push({who:(sig.owners[0]||'Luther'), ask:'to close '+sig.companies[0]+' this week', because:'it is at signature with a promised date already past, the closest thing to booked revenue in the pipeline',
        href:BANDS.pipeline.detail_url, external:true, draft:'Hi '+(sig.owners[0]||'Luther')+', where is '+sig.companies[0]+'? The signature date has passed and it is the nearest thing we have to new booked revenue. What do you need from me to close it?'});
    }
  }
  return lines.slice(0,5);
}
function nextBand(){
  const lines = nextLines();
  let h = '<section class="band" id="band-next"><div class="band-head"><h2>Next</h2><span class="band-note">who to talk to, and the exact question</span></div>';
  if(!lines.length) h += '<div class="empty-note">Nothing needs a call right now. That is worth knowing too.</div>';
  lines.forEach((l,i)=>{
    window.__nx = window.__nx || []; window.__nx[i] = l;
    h += '<div class="nx"><div class="nx-who">Contact <b>'+esc(l.who)+'</b></div>' +
      '<div class="nx-ask">Ask '+esc(l.ask)+',</div><div class="nx-because">because '+esc(l.because)+'.</div>' +
      '<div class="nx-acts"><button type="button" class="nx-btn primary" data-nx="'+i+'">Copy the message</button>' +
      '<a class="nx-btn" href="'+esc(l.href)+'"'+(l.external?' target="_blank" rel="noopener"':'')+'>Open the records</a></div></div>';
  });
  return h + '</section>';
}
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('[data-nx]'); if(!b || !window.SprintPatterns) return;
  const l = (window.__nx||[])[+b.getAttribute('data-nx')]; if(!l) return;
  SprintPatterns.openDraft('A message for '+l.who, 'To '+l.who+', about: '+l.ask+'.', l.draft);
});

// --- 3. the week ----------------------------------------------------------------
function weekBand(){
  const days = []; const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<7;i++){ const d=new Date(today); d.setDate(d.getDate()+i); days.push({d, items:[]}); }
  const put = (iso, text, cls, href) => { const n = daysFrom(iso); if(n==null) return; const i = Math.max(0, Math.min(6, Math.round((new Date(iso).setHours(0,0,0,0) - today)/86400000))); if(n>=0 && n<=6) days[i].items.push({text, cls, href}); };
  (DATA.tenders||[]).forEach(t=> put(t.closes_at, 'Bid closes: '+t.issuer, 'red', '../tenders/index.html'));
  (DATA.documents_expiring||[]).forEach(d=> put(d.expires_at, 'Expires: '+d.name.replace(/^EXAMPLE\s+/,''), 'amber', '../tenders/index.html'));
  const q = DATA.quotes||{}; if(q.expiring7d) days[6].items.push({text:q.expiring7d+' quote'+(q.expiring7d===1?'':'s')+' expire this week', cls:'amber', href:'../sales/index.html'});
  let h = '<section class="band" id="band-week"><div class="band-head"><h2>The week ahead</h2><span class="band-note">diary only</span></div><div class="wk">';
  days.forEach((x,i)=>{
    h += '<div class="wk-day'+(i===0?' today':'')+'"><div class="wk-d">'+DAY[x.d.getDay()]+'<b>'+x.d.getDate()+'</b></div>';
    if(!x.items.length) h += '<div class="wk-none">&nbsp;</div>';
    x.items.forEach(it=>{ h += '<a class="wk-it '+it.cls+'" href="'+it.href+'">'+esc(it.text)+'</a>'; });
    h += '</div>';
  });
  h += '</div><div class="band-honest">Diary certainties only. Nothing on this strip is a forecast: there is no operating history yet to forecast a breakdown from, and a guess dressed as one would be worse than the gap.</div></section>';
  return h;
}

// --- 4. the company right now ---------------------------------------------------
const MAP_TOWNS = [ {n:'Gaborone', lat:-24.65, lng:25.92}, {n:'Mahalapye', lat:-23.10, lng:26.81}, {n:'Palapye', lat:-22.55, lng:27.12}, {n:'Francistown', lat:-21.17, lng:27.51} ];
function mapXY(lat, lng){ const x=(lng-25.55)/(27.85-25.55)*600, y=230-((lat+25.0)/(-20.9+25.0))*230; return {x:Math.max(14,Math.min(586,x)), y:Math.max(16,Math.min(214,y))}; }
function nowBand(){
  const vs = (FLEET_LIVE && FLEET_LIVE.vehicles) || [];
  const withPos = vs.filter(v=>v.position && typeof v.position.lat==='number');
  const pts = MAP_TOWNS.map(t=>mapXY(t.lat,t.lng));
  let svg = '<svg class="co-map" viewBox="0 0 600 230" role="img" aria-label="Where the vehicles are">';
  svg += '<path d="M '+pts[0].x+' '+pts[0].y+' C '+(pts[0].x+70)+' '+(pts[0].y-20)+', '+(pts[1].x-60)+' '+(pts[1].y+30)+', '+pts[1].x+' '+pts[1].y+' S '+(pts[2].x-30)+' '+(pts[2].y+10)+', '+pts[2].x+' '+pts[2].y+' S '+(pts[3].x-40)+' '+(pts[3].y+20)+', '+pts[3].x+' '+pts[3].y+'" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="5" stroke-linecap="round"/>';
  MAP_TOWNS.forEach((t,i)=>{ svg += '<circle cx="'+pts[i].x+'" cy="'+pts[i].y+'" r="4" fill="#C9D6CF"/><text x="'+pts[i].x+'" y="'+(pts[i].y-10)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#C9D6CF">'+t.n+'</text>'; });
  withPos.forEach(v=>{ const at=mapXY(v.position.lat,v.position.lng); const col = v.state==='moving'?'#3AAA35':v.state==='standing'?'#F7941D':v.state==='incident'?'#FF6B61':'#9DAAA4';
    svg += '<a href="../fleet/index.html" role="button" aria-label="'+esc((v.reg||'vehicle').replace('EXAMPLE-','EX '))+'"><circle cx="'+at.x+'" cy="'+at.y+'" r="40" fill="rgba(0,0,0,0.001)"/><circle cx="'+at.x+'" cy="'+at.y+'" r="8" fill="'+col+'" stroke="rgba(8,28,20,.8)" stroke-width="2"/></a>'; });
  svg += '</svg>';
  const mapSay = !FLEET_LIVE ? 'No vehicle has ever reported a position. Nothing on the road carries a tracker yet; that is brick 19, the hardware decision.'
    : (!withPos.length ? 'The hub answers but no vehicle has a position yet. The driver app posts one every 60 seconds once a trip is open.' : withPos.length+' of '+vs.length+' vehicles reporting, '+vs.filter(v=>v.state==='moving').length+' moving.');
  // the departments, as their people: roles and counts only until decision 59 rules on names
  const roles = (PULSE_DATA && PULSE_DATA.roles) || [];
  const jt = DATA.jobs_today||{};
  const people = [
    {dept:'Drivers', who: roles.find(r=>r.role==='driver'), on: ((jt.in_transit||0)+(jt.out_for_delivery||0))+' parcels on the road, '+(jt.delivered||0)+' delivered today', href:'../driver/index.html'},
    {dept:'Operations', who: roles.find(r=>r.role==='ops'), on: (jt.exception||0)+' exception'+(jt.exception===1?'':'s')+' open, '+(jt.booked||0)+' booked and waiting', href:'../ops/index.html'},
    {dept:'Accounts', who: roles.find(r=>r.role==='accounts'), on: (((DATA.cash||{}).overdue_by_customer||[]).length)+' accounts overdue', href:'../accounts/index.html'},
    {dept:'Sales', who: null, on: BANDS ? BANDS.pipeline.rows+' conversations open, '+(BANDS.pipeline.chips.find(c=>c.label==='Won')||{count:0}).count+' won' : 'pipeline not loaded', href:'../sales/index.html'},
    {dept:'Care', who: null, on: 'intake bot on, patterns not built yet', href:'../care/index.html'},
  ];
  let h = '<section class="band" id="band-now"><div class="band-head"><h2>The company right now</h2><span class="band-note">'+esc(clockWord())+'</span></div>' +
    '<a class="co-mapcard" href="../fleet/index.html">'+svg+'<div class="co-say">'+esc(mapSay)+'</div></a><div class="co-people">';
  people.forEach(p=>{ const n = p.who ? p.who.headcount : null;
    h += '<a class="co-dept" href="'+p.href+'"><div class="co-d">'+esc(p.dept)+(n!=null?' <span>'+n+' '+(n===1?'person':'people')+'</span>':'')+'</div><div class="co-on">'+esc(p.on)+'</div></a>'; });
  h += '</div><div class="band-honest">Roles and counts, not names, until decision 59 is ruled. Per person figures are for coaching and cover, never a league table.</div></section>';
  return h;
}

// --- October, pulled forward where the disk already knows -----------------------
function expiryBand(){
  if(!BANDS || !BANDS.expiry) return '';
  var e = BANDS.expiry, W = e.window_days;
  var silent = e.states_no_date || 0, noText = (e.no_text_layer||[]).length, scanned = e.scanned || 0;
  var h = '<section class="band" id="band-expiry"><div class="band-head"><h2>Expiring inside '+W+' days</h2>' +
    '<span class="band-note">'+(e.deep ? 'every page of '+scanned+' documents read '+esc((e.generated_at||'').slice(0,16).replace('T',' ')) : 'register read '+esc(e.generated_at||''))+'</span></div>';

  // The finding comes FIRST, because it is the answer to her question and the list is not.
  // She asked what expires in sixty days. The honest answer is that the paperwork does not say.
  if(silent || noText){
    // The list of what is missing is DERIVED, never typed. A sentence that names the BOCRA licence
    // as undated was true at 04:13 and false at 04:30, when a rescan found it. Prose about data
    // goes stale silently; this cannot.
    var have = (e.items||[]).map(function(x){ return (x.category||'').toLowerCase(); }).join(' ');
    var WATCH = [['bocra','the BOCRA licence'],['trade licence','a trade licence'],
                 ['transit','goods in transit cover'],['motor','motor insurance'],
                 ['permit','a driver permit'],['ppra','the PPRA codes'],['vat','the VAT registration']];
    var absent = WATCH.filter(function(w){ return have.indexOf(w[0]) === -1; }).map(function(w){ return w[1]; });
    h += '<div class="ex-unread"><b>'+(silent+noText)+' of '+scanned+' compliance documents state no expiry date at all.</b> ' +
      (absent.length ? 'Among them, nothing on this machine gives a date for ' + esc(absent.join(', ')) + '. ' : '') +
      (noText ? noText+' are scans with no text a machine can read. ' : '') +
      'So this wall cannot warn about them, and nor can anyone else. Somebody has to open each original and write the date down. ' +
      '<b>Owner: Snowy, backup Barbara.</b></div>';
  }

  if(!e.items.length){
    h += '<div class="band-lead">Nothing that states a date runs out inside '+W+' days.</div>';
  } else {
    h += '<div class="band-lead">'+e.items.length+' document'+(e.items.length===1?'':'s')+' state'+(e.items.length===1?'s':'')+' a date, and '+
      (e.inside_window.length ? e.inside_window.length+' of those fall inside '+W+' days' : 'none of them falls inside '+W+' days')+'.</div>';
  }

  e.items.forEach(function(w){
    var d = w.days_left;
    var pct = d==null ? 0 : Math.max(2, Math.min(100, Math.round((1 - Math.min(d,W)/W)*100)));
    var cls = d==null ? '' : (d<=14 ? 'red' : (d<=W ? 'amber' : 'green'));
    h += '<div class="ex"><div class="ex-top"><span>'+esc(w.category)+'</span><b>'+(d==null?'no date':d+' days')+', '+esc(w.owner)+'</b></div>' +
      '<div class="ex-bar"><i class="'+cls+'" style="width:'+(d!=null&&d>W?100:pct)+'%"></i></div>' +
      // the evidence: the page and the words it was read from, so nobody takes the number on trust
      (w.phrase ? '<div class="ex-cite">page '+(w.page||'?')+': &ldquo;'+esc(w.phrase)+'&rdquo;</div>' : '') +
      '</div>';
  });
  return h + '</section>';
}
function pipelineBand(){
  if(!BANDS || !BANDS.pipeline) return '';
  const p = BANDS.pipeline;
  let h = '<section class="band" id="band-pipeline"><div class="band-head"><h2>Sales pipeline</h2><span class="band-note">'+p.rows+' conversations, estimates</span></div><div class="pl">';
  p.chips.forEach(c=>{ h += '<a class="pl-chip" href="'+esc(p.detail_url)+'" target="_blank" rel="noopener"><div class="pl-n">'+c.count+'</div><div class="pl-l">'+esc(c.label)+'</div>' +
    '<div class="pl-v">'+(c.monthly_estimate_p!=null ? 'P'+c.monthly_estimate_p.toLocaleString('en-GB')+' a month, est.' : 'value unknown')+(c.next_step_overdue?'<br>'+c.next_step_overdue+' next step'+(c.next_step_overdue===1?'':'s')+' overdue':'')+'</div></a>'; });
  h += '</div><div class="band-honest">'+esc(p.estimate_note)+' <a class="band-link" href="'+esc(p.detail_url)+'" target="_blank" rel="noopener">See every deal in the Closer</a></div></section>';
  return h;
}
function notBuiltLines(){
  const nb = (BANDS && BANDS.not_built) || {};
  return '<section class="band" id="band-notbuilt"><div class="band-honest">Not built yet, and not faked: '+esc(nb.incident_trends||'incident trends need history.')+' '+esc(nb.care_patterns||'Care patterns need history.')+'</div></section>';
}

function render(){
  updateSyncBadge();
  const bw = document.getElementById('bannerWrap');
  if(DATA.example) bw.innerHTML = '<div class="banner-example">EXAMPLE DATA. Every company, tender, parcel and number on this screen is invented to show how the screen works. Connect the hub to see Sprint\'s own.</div>';
  else if(!DATA.live) bw.innerHTML = '<div class="banner-stale">Showing last synced data from '+localDT(SYNCED_AT)+'. Hub unreachable now.</div>';
  else bw.innerHTML = '';

  const g=[];
  g.push(ringHtml());            // brick 57, the score ring, stays as the hero the overhead sits under
  g.push(overheadBand());
  g.push(nextBand());
  g.push(weekBand());
  g.push(nowBand());
  g.push(expiryBand());
  g.push(pipelineBand());
  g.push(notBuiltLines());
  document.getElementById('grid').innerHTML = g.join('');
}

// --- Sprint Pulse panel (decision #48, /api/recognition/leaderboard) --------
// A separate fetch on purpose: recognition is its own contracted endpoint,
// not folded into /api/cockpit's payload. Renders outside the main JS
// driven grid (#pulsePanelWrap, not #grid) so the 60 second cockpit refresh
// never has to know about it.
let PULSE_DATA = null;
const PULSE_ROLE_LABEL = {driver:'Drivers', ops:'Ops', accounts:'Accounts', staff:'Staff', manager:'Managers', admin:'Admin'};

async function loadPulse(){
  try{
    const data = await apiFetch('/api/recognition/leaderboard?period=week');
    PULSE_DATA = Object.assign({live:true}, data);
  }catch(e){
    PULSE_DATA = Object.assign({example:true}, PULSE_EXAMPLE);
  }
  renderPulse();
  SprintPulseWidget.mount('pulseWidget');
}

function renderPulse(){
  const wrap = document.getElementById('pulsePanelWrap');
  if(!PULSE_DATA){ wrap.innerHTML=''; return; }
  const p = [];
  p.push('<div class="panel"><h2>Sprint Pulse, this week</h2>');
  if(PULSE_DATA.example) p.push('<div class="empty-note" style="margin-bottom:6px;">EXAMPLE DATA. Every company, tender, parcel and number on this screen is invented to show how the screen works.</div>');

  const tg = PULSE_DATA.team_goal || {value_pct:null, threshold_pct:95, met:false, judged_deliveries:0};
  const pct = tg.value_pct==null ? 0 : tg.value_pct;
  const cls = tg.met ? 'green' : 'red';
  p.push('<div class="bar-row"><div class="bar-top"><span class="lab">Team on time rate vs 95% goal</span>'+
    '<span class="val">'+(tg.value_pct==null?'No judged deliveries yet':tg.value_pct+'%')+'</span></div>'+
    '<div class="bar"><div class="bar-fill '+(tg.value_pct==null?'dim':cls)+'" style="width:'+Math.max(2,pct)+'%"></div></div></div>');
  p.push('<div style="margin:4px 0 10px;"><span class="verdict '+(tg.value_pct==null?'':cls)+'">'+(tg.met?'Team goal met':'Not yet')+'</span></div>');

  p.push('<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;">');
  const roles = PULSE_DATA.roles || [];
  if(roles.length===0) p.push('<div class="empty-note">No scored activity yet this week.</div>');
  roles.forEach(r=>{
    const label = PULSE_ROLE_LABEL[r.role] || esc(r.role);
    p.push('<div><div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">'+label+'</div>');
    if(r.named_individuals){
      (r.top||[]).forEach((person,i)=>{
        p.push('<div class="who-row"><span class="who-name">'+(i+1)+'. '+esc(person.name)+'</span><span class="who-amt">'+person.points+' pts</span></div>');
      });
      if((r.top||[]).length===0) p.push('<div class="empty-note">Nothing scored yet.</div>');
    } else {
      p.push('<div class="item-row"><span class="item-name">Team total ('+r.headcount+' scored)</span><span class="who-amt">'+r.team_total_points+' pts</span></div>');
    }
    p.push('</div>');
  });
  p.push('</div></div>');
  wrap.innerHTML = p.join('');
}

loadPulse();
setInterval(loadLive, 60000);
setInterval(loadPulse, 60000);

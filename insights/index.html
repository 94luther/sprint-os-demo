:root{

  --orange-w:rgba(247,148,29,.22);--red:#FF6B61;--red-d:#FFB3AD;--red-w:rgba(214,69,61,.2);--sky:#3AAA35;--sky-d:#8FE08A;--sky-w:rgba(58,170,53,.22);
  --stone:#8A9992;--stone-d:#C9D6CF;--stone-w:rgba(255,255,255,.08);
  --shadow:0 22px 54px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12);
  --font:"Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(520px 440px at 16% 10%, rgba(140,235,150,.42), transparent 62%),radial-gradient(420px 420px at 84% 26%, rgba(255,255,255,.26), transparent 60%),radial-gradient(760px 640px at 90% 94%, rgba(247,148,29,.85), transparent 58%),radial-gradient(400px 400px at 26% 80%, rgba(255,176,70,.30), transparent 60%),radial-gradient(300px 300px at 60% 52%, rgba(255,255,255,.08), transparent 60%),linear-gradient(155deg,#0B3D2E 0%,#176B45 36%,#2A9257 56%,#8A5A1E 82%,#B8671A 100%);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:5;background:rgba(8,28,20,.52);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;border-bottom:1px solid var(--rule);font-size:12.6px}
.top .wrap{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.top b{font-weight:800;letter-spacing:.4px}
.top .dot{width:8px;height:8px;border-radius:50%;background:var(--stone)}
.top .dot.on{background:var(--green)}
.top a{color:#FDDCB5;text-decoration:none;font-weight:700;margin-left:auto}
h1{font-size:22px;font-weight:900;letter-spacing:-.3px;margin:26px 0 4px}
.lead{font-size:14px;color:var(--ink-2);margin:0 0 18px;max-width:700px}
h2{font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);margin:30px 0 10px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{background:rgba(8,28,20,.40);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--rule)}
.card.red{border-top-color:var(--red)}.card.orange{border-top-color:var(--orange)}.card.sky{border-top-color:var(--sky)}.card.green{border-top-color:var(--green)}
.card .t{font-size:15.5px;font-weight:800;line-height:1.3;margin:0 0 6px}
.card .w{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.card .who{font-size:12.4px;color:var(--ink);margin:0}
.card .who b{color:var(--sky-d)}
.num{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1;margin:2px 0 6px}
.num .u{font-size:12px;font-weight:800;color:var(--ink-2);margin-left:3px}
.bars{display:flex;flex-direction:column;gap:5px;margin:6px 0}
.brow{display:flex;align-items:center;gap:8px}
.blab{font-size:10.5px;color:var(--ink-3);width:84px;flex:0 0 84px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:13px;background:var(--paper-2);border-radius:7px;overflow:hidden}
.bfill{height:100%;border-radius:7px;background:var(--stone);min-width:2px}
.bfill.now{background:var(--sky)}.bfill.good{background:var(--green)}.bfill.bad{background:var(--red)}.bfill.warn{background:var(--orange)}
.bval{font-size:11.5px;font-weight:800;color:var(--ink-2);width:78px;flex:0 0 78px}
.move{font-size:11.8px;font-weight:800}.move.good{color:var(--green-d)}.move.bad{color:var(--red-d)}.move.flat{color:var(--ink-3)}
.basis{font-size:12px;color:var(--ink-3);margin-top:6px}
.unknown{background:repeating-linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.05) 7px,rgba(255,255,255,.1) 7px,rgba(255,255,255,.1) 14px);border:1px dashed rgba(255,255,255,.3);border-radius:8px;padding:10px 12px;font-size:12.6px;color:var(--stone-d)}
.unknown b{color:var(--ink)}
.call{background:rgba(8,28,20,.40);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.call .to{font-size:14.5px;font-weight:800}
.call .to b{color:var(--sky-d)}
.call .q{font-size:13px;color:var(--ink-2);margin:4px 0 8px}
.call textarea{width:100%;min-height:80px;border:1px solid var(--rule);border-radius:12px;padding:9px;font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.08);resize:vertical}
.call .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:var(--font);background:#fff;color:#0E2F22}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.nosend{font-size:11.4px;font-weight:800;color:var(--stone-d);background:var(--stone-w);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.flash{font-size:12px;color:var(--green-d);font-weight:700;display:none}.flash.show{display:inline}
.list{background:rgba(8,28,20,.40);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:22px;padding:6px 16px;box-shadow:var(--shadow)}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.4px}
.li:last-child{border-bottom:0}
.li .k{color:var(--ink)}.li .v{font-weight:800;white-space:nowrap}
.li .v.bad{color:var(--red-d)}.li .v.good{color:var(--green-d)}.li .v.warn{color:var(--orange-d)}
.foot{margin:34px 0 40px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:14px}

/* Do this now: the proactive band. Orange is the one accent, used once per card as the power button. */
.act{background:rgba(8,28,20,.40);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow);margin-bottom:12px;border-left:5px solid var(--orange)}
.act.calm{border-left-color:var(--green)}
.act .h{display:flex;align-items:flex-start;gap:12px}
.act .pw{width:44px;height:44px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 18px -8px rgba(247,148,29,.8)}
.act .pw svg{width:22px;height:22px;stroke:#fff}
.act .t{font-size:15.5px;font-weight:800;line-height:1.25}
.act .w{font-size:13px;color:var(--ink-2);margin-top:3px}
.act .people{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.act .person{font-size:11.5px;font-weight:800;background:var(--green-w);color:var(--green-d);border-radius:999px;padding:4px 10px}
.act details{margin-top:8px}
.act summary{font-size:12.5px;font-weight:800;color:var(--green-d);cursor:pointer;list-style:none}
.act summary::before{content:'\25B8  '}
.act details[open] summary::before{content:'\25BE  '}
.act .msg{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 11px;font-size:12.6px;color:var(--ink);margin-top:8px;white-space:pre-wrap}
.act .msg b{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px;font-weight:800}
.act .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.act .btn{background:#fff;color:#0E2F22}
.act .numbers{font-size:11.5px;color:var(--ink-3)}

.hdr-bell{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none;margin-left:10px;vertical-align:middle}
.hdr-bell svg{width:16px;height:16px;stroke:#F4F7F5;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Brick 72: what the system did, the log from his friend's app */
.didcard{border-radius:22px;padding:14px 16px 8px;margin:12px 0 14px;background:rgba(8,28,20,.40);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 22px 54px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12)}
.didcard .h{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#C9D6CF;margin-bottom:6px}
.didrow{display:flex;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.10);font-size:13px;line-height:1.4}
.didrow:first-of-type{border-top:0}
.didrow .t{flex:none;width:44px;color:#A7B5AE;font-variant-numeric:tabular-nums;font-weight:700}

.didfoot{font-size:11.2px;color:#93A29B;padding:10px 0 6px;line-height:1.4}

rate"}, {"id": "cus_mtyurp951528ee6b", "name": "EXAMPLE Customer 37", "type": "corporate"}, {"id": "cus_mtyurp9ad3c8a663", "name": "EXAMPLE Customer 212", "type": "corporate"}, {"id": "cus_mtyurp9a5857a6ff", "name": "EXAMPLE Customer 202", "type": "corporate"}, {"id": "cus_mtyurp9a630b8edf", "name": "EXAMPLE Customer 126", "type": "corporate"}, {"id": "cus_mtyurp9ab201511b", "name": "EXAMPLE Customer 30", "type": "corporate"}, {"id": "cus_mtyurp9a0afb316d", "name": "EXAMPLE Customer 170", "type": "corporate"}, {"id": "cus_mtyurp9a9e4a5b2e", "name": "EXAMPLE Customer 13", "type": "corporate"}, {"id": "cus_mtyurp9a450d23ff", "name": "EXAMPLE Customer 217", "type": "corporate"}, {"id": "cus_mtyurp9a9527a8f2", "name": "EXAMPLE Customer 178", "type": "corporate"}, {"id": "cus_mtyurp9a0357a8ef", "name": "EXAMPLE Customer 159", "type": "corporate"}, {"id": "cus_mtyurp9a5ff7ac92", "name": "EXAMPLE Customer 94", "type": "corporate"}, {"id": "cus_mtyurp9c2c68b484", "name": "EXAMPLE Customer 85", "type": "corporate"}]}</script>
<script>
var DATA = JSON.parse(document.getElementById('island').textContent.replace('/*__DATA__*/',''));
var LIVE = false;

function pula(t){ return 'P' + (Math.round(t)/100).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function day(iso){ if(!iso) return ''; var d=new Date(iso); return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; }
function hhmm(iso){ var d=new Date(iso); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function bar(label, val, top, cls, shown){
  var w = top>0 ? Math.max(2, Math.round(val/top*100)) : 2;
  return '<div class="brow"><span class="blab" title="'+esc(label)+'">'+esc(label)+'</span><span class="btrack"><span class="bfill '+cls+'" style="width:'+w+'%"></span></span><span class="bval">'+esc(shown)+'</span></div>';
}
function metric(key){ return (DATA.overhead && DATA.overhead.metrics || []).filter(function(m){return m.key===key;})[0]; }

/* ---------- the five things: gathered from every engine, then ranked ---------- */
function gather(){
  var items = [];
  var un = DATA.uninvoiced;
  if (un && un.known && un.count > 0) {
    var names = {}; un.rows.forEach(function(r){ names[r.customer_name]=(names[r.customer_name]||0)+1; });
    var who = Object.keys(names).sort(function(a,b){return names[b]-names[a];});
    items.push({ rank: un.value_thebe + 500000, cls:'red', t: un.count+' deliveries done and never invoiced, '+pula(un.value_thebe),
      w: 'The work is finished and paid for in fuel and time. Nobody has asked the customer for the money. '+(who.length===1 ? 'All of it is '+who[0]+'.' : 'Mostly '+who[0]+', and '+(who.length-1)+' more.'),
      who:'Accounts', q:'Please raise the invoices for the delivered parcels with no invoice line, starting with '+who[0]+', and tell me by Friday what was billed.' });
  }
  var cash = DATA.cockpit && DATA.cockpit.cash;
  if (cash && cash.overdue_thebe > 0) {
    var top = cash.overdue_by_customer[0];
    items.push({ rank: cash.overdue_thebe + 400000, cls:'orange', t: pula(cash.overdue_thebe)+' overdue, '+(top ? 'most of it '+top.customer_name : ''),
      w: 'Invoiced, past due, unpaid. Cash collected in the last 30 days was '+pula(cash.paid_30d_thebe)+', so what is overdue is '+(cash.paid_30d_thebe>0 ? Math.round(cash.overdue_thebe/cash.paid_30d_thebe*10)/10+' times' : 'more than')+' a month of collections.',
      who:'Accounts', q:'Which overdue invoices have been chased this week, and which customer needs a call from me rather than another statement?' });
  }
  (DATA.decline && DATA.decline.shrinking || []).slice(0,2).forEach(function(s){
    items.push({ rank: 350000 + s.down_pct*1000, cls:'orange', t: s.customer+' sent '+s.this_month+' this month against '+s.last_month+' last month, down '+s.down_pct+'%',
      w: 'A customer does not resign. They send less, then less, then nothing. This is the earliest warning there is, and it costs a phone call to act on.',
      who:'Barbara', q:'Could you call '+s.customer+' this week? They are sending noticeably less than last month and I would like to know why before it becomes nothing.' });
  });
  (DATA.fleet && DATA.fleet.fuel_anomalies || []).slice(0,2).forEach(function(a){
    items.push({ rank: 300000, cls:'orange', t: a.reg+': the fuel does not add up', w: a.message, who:'Fleet', q:'Please have a look at '+a.reg+' this week. '+a.message+' I would like to know whether it is the vehicle or the slip.' });
  });
  (DATA.cockpit && DATA.cockpit.open_incidents || []).forEach(function(i){
    items.push({ rank: 450000 + i.severity*10000, cls:'red', t: 'Open incident: '+i.title.replace(/^EXAMPLE:\s*/,'EXAMPLE '), w: 'Severity '+i.severity+' of 5, status '+i.status+', opened '+day(i.opened_at)+'. Every affected customer should already have had a notice.', who:'Operations', q:'Where does the '+i.title.replace(/^EXAMPLE:\s*/,'')+' incident stand right now, and has every affected customer been told?' });
  });
  (DATA.cockpit && DATA.cockpit.tenders || []).filter(function(t){return t.days_left<=9;}).forEach(function(t){
    var late = t.days_left < 0;
    items.push({ rank: late ? 200000 : 380000, cls: late?'sky':'orange', t: t.issuer+' tender '+(late ? 'closed '+Math.abs(t.days_left)+' days ago' : 'closes in '+t.days_left+' days'),
      w: late ? 'The closing date has passed. What matters now is whether we submitted, and what we learned.' : 'The closing date does not move for anybody.', who:'Luther', q: late ? 'Did the '+t.issuer+' bid go in, and what is the one lesson from it?' : 'Where does the '+t.issuer+' bid stand, and what is still missing?' });
  });
  (DATA.fleet && DATA.fleet.service_due || []).filter(function(s){return s.overdue;}).forEach(function(s){
    items.push({ rank: 250000, cls:'sky', t: s.reg+' is overdue for service', w: 'Due '+(s.service_due_at||'')+(s.overdue_by_km?', and by distance':'')+'. A missed service is a breakdown with a date on it.', who:'Fleet', q:'When is '+s.reg+' booked in for its service? It is past due.' });
  });
  var vm = metric('vehicles_moving');
  if (vm && vm.known === false) items.push({ rank: 100000, cls:'sky', t:'Nobody knows where the vehicles are', w: vm.why, who: 'Operations', q:'Which two drivers can run the app on real trips from Monday, so the map has something to draw?' });
  items.sort(function(a,b){ return b.rank - a.rank; });
  return items;
}

function renderKnow(items){
  var root = document.getElementById('know'); root.innerHTML='';
  if (!items.length) { root.innerHTML = '<div class="card green"><p class="t">Nothing needs you this morning.</p><p class="w">Every check the system ran came back quiet. That is a real answer, not a missing one.</p></div>'; return; }
  items.slice(0,5).forEach(function(i, n){
    root.innerHTML += '<div class="card '+i.cls+'"><p class="t">'+(n+1)+'. '+esc(i.t)+'</p><p class="w">'+esc(i.w)+'</p><p class="who">Ask <b>'+esc(i.who)+'</b></p></div>';
  });
}

/* ---------- money, drawn as space ---------- */
function renderMoney(){
  var root = document.getElementById('money'); root.innerHTML='';
  var owed = metric('money_owed');
  if (owed && owed.known) {
    var top = Math.max(owed.value, owed.prev||0, 1);
    var good = owed.prev!=null && owed.value < owed.prev, bad = owed.prev!=null && owed.value > owed.prev;
    root.innerHTML += '<div class="card"><p class="t">Money owed to Sprint</p><div class="num">'+pula(owed.value)+'</div><div class="bars">'+
      bar('this week', owed.value, top, good?'good':(bad?'bad':'now'), pula(owed.value)) + (owed.prev!=null ? bar('last week', owed.prev, top, '', pula(owed.prev)) : '') + '</div>'+
      '<div class="move '+(good?'good':bad?'bad':'flat')+'">'+(owed.prev==null?'No earlier week to compare.':good?'Down '+pula(owed.prev-owed.value)+' on last week.':bad?'Up '+pula(owed.value-owed.prev)+' on last week.':'The same as last week.')+'</div><div class="basis">'+esc(owed.basis)+'</div></div>';
  } else if (owed) {
    root.innerHTML += '<div class="card"><p class="t">Money owed to Sprint</p><div class="unknown"><b>Not known yet.</b> '+esc(owed.why)+'</div></div>';
  }
  var cash = DATA.cockpit && DATA.cockpit.cash;
  if (cash && cash.overdue_by_customer && cash.overdue_by_customer.length) {
    var t2 = Math.max.apply(null, cash.overdue_by_customer.map(function(c){return c.amount_thebe;}));
    root.innerHTML += '<div class="card"><p class="t">Overdue, by who owes it</p><div class="bars">'+cash.overdue_by_customer.slice(0,6).map(function(c){ return bar(c.customer_name, c.amount_thebe, t2, 'warn', pula(c.amount_thebe)); }).join('')+'</div><div class="basis">Collected in the last 30 days: '+pula(cash.paid_30d_thebe)+'.</div></div>';
  }
  var un = DATA.uninvoiced;
  if (un && un.known) {
    if (un.count > 0) {
      var by = {}; un.rows.forEach(function(r){ by[r.customer_name]=(by[r.customer_name]||0)+(r.amount_thebe||0); });
      var ks = Object.keys(by).sort(function(a,b){return by[b]-by[a];}); var t3 = by[ks[0]]||1;
      root.innerHTML += '<div class="card red"><p class="t">Delivered and never invoiced</p><div class="num">'+pula(un.value_thebe)+'</div><div class="bars">'+ks.slice(0,6).map(function(k){return bar(k, by[k], t3, 'bad', pula(by[k]));}).join('')+'</div><div class="basis">'+esc(un.basis)+'</div></div>';
    } else {
      root.innerHTML += '<div class="card green"><p class="t">Delivered and never invoiced</p><div class="num">P0.00</div><div class="basis">'+esc(un.basis)+' That is a checked zero, not an empty table.</div></div>';
    }
  }
  var mpc = DATA.fleet && DATA.fleet.margin_per_customer || [];
  if (mpc.length) {
    var t4 = Math.max.apply(null, mpc.map(function(m){return Math.abs(m.margin_thebe);}));
    root.innerHTML += '<div class="card"><p class="t">What each customer really leaves after fuel</p><div class="bars">'+mpc.map(function(m){ return bar(m.customer_name, Math.abs(m.margin_thebe), t4, m.margin_thebe<0?'bad':'good', (m.margin_thebe<0?'minus ':'')+pula(Math.abs(m.margin_thebe))); }).join('')+'</div><div class="basis">Revenue less the fuel it took, on the deliveries that could be both priced and costed. A customer in red is costing more to serve than they pay.</div></div>';
  }
}

/* ---------- who to call ---------- */
function renderCalls(items){
  var root = document.getElementById('calls'); root.innerHTML='';
  var seen = {};
  items.forEach(function(i){
    if (seen[i.who]) return; seen[i.who]=1;
    var id = 'c'+Math.random().toString(36).slice(2,8);
    root.innerHTML += '<div class="call"><div class="to">Call <b>'+esc(i.who)+'</b></div><div class="q">'+esc(i.t)+'</div>'+
      '<textarea readonly id="'+id+'">'+esc('Hi, '+i.q+' Thank you.')+'</textarea>'+
      '<div class="row"><button class="btn ghost" data-copy="'+id+'">Copy</button><span class="nosend">nothing sends itself</span><span class="flash" id="'+id+'f">Copied</span></div></div>';
  });
  root.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var ta = document.getElementById(b.getAttribute('data-copy')); ta.select();
      var done = function(){ var f=document.getElementById(ta.id+'f'); f.classList.add('show'); setTimeout(function(){f.classList.remove('show');},1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function(){ try{document.execCommand('copy');}catch(e){} done(); });
      else { try{document.execCommand('copy');}catch(e){} done(); }
    });
  });
  if (!items.length) root.innerHTML = '<div class="call"><div class="to">Nobody needs a call this morning.</div></div>';
}

/* ---------- fleet ---------- */
function renderFleet(){
  var root = document.getElementById('fleet'); root.innerHTML='';
  var f = DATA.fleet; if (!f) return;
  // A fleet with no closed trips has no median. Zero would draw a baseline
  // saying the fleet does nothing to the litre, and would compare every
  // vehicle against it (feedback_never_print_unproven_zero).
  var med = (typeof f.fleet_median_km_per_litre === 'number' && f.fleet_median_km_per_litre > 0) ? f.fleet_median_km_per_litre : null;
  var vs = f.vehicles || [];
  var top = Math.max.apply(null, vs.map(function(v){return v.km_per_litre||0;}).concat([med || 0, 1]));
  var live = {}; ((DATA.live && DATA.live.vehicles) || []).forEach(function(v){ live[v.vehicle_id]=v; });
  root.innerHTML += '<div class="card"><p class="t">Kilometres per litre, each vehicle against the fleet</p><div class="bars">'+vs.map(function(v){
    var k = v.km_per_litre; var cls = (k==null || med==null) ? '' : (k < med*0.85 ? 'bad' : 'good');
    return bar(v.reg.replace('EXAMPLE-','EX '), k||0, top, cls, k==null ? 'not yet' : k+' km per l');
  }).join('') + (med==null
    ? '<div class="basis">There is no fleet median yet. It needs closed trips carrying an odometer reading at depart and at close, with the litres from the fuel slip. Until then no vehicle can be compared against the fleet. Owner: whoever runs operations.</div>'
    : bar('fleet median', med, top, 'now', med+' km per l')) + '</div><div class="basis">A vehicle well under the fleet figure is a mechanical question or a fuel question, and either one is worth asking this week.</div></div>';
  root.innerHTML += '<div class="list">'+vs.map(function(v){
    var l = live[v.id] || {}; var state = l.state || 'unknown';
    var words = state==='moving'?'moving now':state==='standing'?'standing '+(l.standing_minutes||0)+' min':state==='no_signal'?'on a trip, no signal':state==='no_trip'?'no trip open':'unknown';
    var sd = (f.service_due||[]).filter(function(s){return s.vehicle_id===v.id;})[0];
    return '<div class="li"><span class="k">'+esc(v.reg.replace('EXAMPLE-','EX '))+' <span style="color:var(--ink-3)">'+esc(v.type)+'</span></span><span class="v '+(state==='moving'?'good':sd&&sd.overdue?'warn':'')+'">'+esc(words)+(sd&&sd.overdue?' · service overdue':'')+'</span></div>';
  }).join('')+'</div>';
}

/* ---------- honesty ---------- */
function renderBlind(){
  var root = document.getElementById('blind'); root.innerHTML='';
  var rows = [];
  (DATA.overhead && DATA.overhead.metrics || []).filter(function(m){return !m.known;}).forEach(function(m){ rows.push({k: m.name+': '+m.why, v: (m.drill||'').replace(/^.*Owner:\s*/,'') || ''}); });
  (DATA.sources && DATA.sources.sources || []).filter(function(s){return s.state==='never'||s.state==='stale';}).forEach(function(s){ rows.push({k: s.name+': '+s.note, v: s.owner}); });
  if (!rows.length) rows.push({k:'Every feed this page reads from is current.', v:''});
  root.innerHTML = rows.map(function(r){ return '<div class="li"><span class="k">'+esc(r.k)+'</span><span class="v">'+esc(r.v)+'</span></div>'; }).join('');
}


/* ---------- Do this now: the proactive band ---------- */
function customerName(id){
  var c = (DATA.customers || []).filter(function(x){ return x.id === id; })[0];
  return c ? c.name : 'a customer';
}
function lateNotice(waybill, reason, by){
  return 'Hello, this is Sprint Couriers. Your parcel ' + waybill + ' is running late because ' + reason +
    '. We will update you by ' + by + ' today. We are sorry for the trouble and thank you for your patience.';
}
function buildActions(items){
  var acts = [];
  // 1. the flagship: a vehicle in an incident, every customer on it told before they have to ask
  (DATA.incidents || []).filter(function(i){ return i.status !== 'closed'; }).forEach(function(i){
    var man = {}; try { man = JSON.parse(i.manifest_snapshot_json || '{}'); } catch(e) {}
    var ships = man.manifest || man.shipments || [];
    if (!ships.length) return;
    var reason = i.type === 'vehicle_accident' ? 'the vehicle carrying it has been involved in an accident' : 'the vehicle carrying it has been held up';
    var msgs = ships.map(function(s){ return { who: customerName(s.customer_id), waybill: s.waybill, text: lateNotice(s.waybill, reason, '15:00') }; });
    var names = []; msgs.forEach(function(m){ if (names.indexOf(m.who) < 0) names.push(m.who); });
    acts.push({ hot: true, t: 'Text the ' + names.length + ' customers whose parcels are on ' + (i.vehicle_id ? 'the vehicle in the incident' : 'that trip') + ' that they will be late',
      w: ships.length + ' parcels are on the manifest of "' + i.title.replace(/^EXAMPLE:\s*/,'EXAMPLE ') + '". Every one of these customers will find out anyway. Better they hear it from Sprint first, with a time.',
      names: names, msgs: msgs, all: msgs.map(function(m){ return m.who + ' (' + m.waybill + '):\n' + m.text; }).join('\n\n') });
  });
  // 2. money that is already earned
  var un = DATA.uninvoiced;
  if (un && un.known && un.count > 0) {
    acts.push({ hot: true, t: 'Raise ' + un.count + ' invoices for work already delivered, ' + pula(un.value_thebe),
      w: 'The list is ready. Accounts can bill every one of these today.',
      names: [], msgs: [{ who: 'Accounts', waybill: '', text: 'Hi, ' + un.count + ' delivered parcels have no invoice against them, ' + pula(un.value_thebe) + ' in total: ' + un.rows.map(function(r){ return r.waybill; }).join(', ') + '. Please raise them today and tell me what went out. Thank you.' }],
      all: '' });
  }
  var cash = DATA.cockpit && DATA.cockpit.cash;
  if (cash && cash.overdue_by_customer && cash.overdue_by_customer.length) {
    var top = cash.overdue_by_customer[0];
    acts.push({ hot: false, t: 'Send ' + top.customer_name + ' a statement for ' + pula(top.amount_thebe) + ' overdue',
      w: 'Past due and unpaid. A statement today, a call on Friday if nothing moves.',
      names: [top.customer_name], msgs: [{ who: top.customer_name, waybill: '', text: 'Hello, this is Sprint Couriers Accounts. Our records show ' + pula(top.amount_thebe) + ' is now past its due date. If it has already been paid, please ignore this and accept our thanks. If not, we would be grateful for payment this week, and we are happy to send the invoices again. Thank you.' }],
      all: '' });
  }
  // 3. the customer slipping away
  (DATA.decline && DATA.decline.shrinking || []).slice(0,1).forEach(function(s){
    acts.push({ hot: false, t: 'Call ' + s.customer + ' before they stop sending altogether',
      w: s.this_month + ' parcels this month against ' + s.last_month + ' last month. A phone call now costs nothing; winning them back later costs a discount.',
      names: [s.customer], msgs: [{ who: 'Barbara', waybill: '', text: 'Hi Barbara, could you give ' + s.customer + ' a call this week? They sent ' + s.last_month + ' last month and only ' + s.this_month + ' so far this month. I would like to know why before it becomes nothing. Thank you.' }],
      all: '' });
  });
  // 4. the vehicle
  (DATA.fleet && DATA.fleet.service_due || []).filter(function(s){ return s.overdue; }).slice(0,1).forEach(function(s){
    acts.push({ hot: false, t: 'Book ' + s.reg.replace('EXAMPLE-','EX ') + ' in for its service, it is overdue',
      w: 'A missed service is a breakdown with a date on it, and a breakdown is a day of late parcels.',
      names: ['Fleet'], msgs: [{ who: 'Fleet', waybill: '', text: 'Hi, ' + s.reg + ' is past its service date. Could you book it in this week and tell me the day, so dispatch can plan around it? Thank you.' }],
      all: '' });
  });
  return acts;
}
function renderActions(){
  var root = document.getElementById('actions'); if (!root) return;
  root.innerHTML = '';
  var acts = buildActions();
  if (!acts.length) { root.innerHTML = '<div class="act calm"><div class="h"><div><div class="t">Nothing to do right now.</div><div class="w">Every check came back quiet. That is a real answer.</div></div></div></div>'; return; }
  acts.forEach(function(a, n){
    var id = 'a' + n;
    var people = a.names.length ? '<div class="people">' + a.names.map(function(x){ return '<span class="person">' + esc(x) + '</span>'; }).join('') + '</div>' : '';
    var body = a.msgs.map(function(m){ return '<div class="msg"><b>' + esc(m.who) + (m.waybill ? ' \u00b7 ' + esc(m.waybill) : '') + '</b>' + esc(m.text) + '</div>'; }).join('');
    var all = a.all || a.msgs.map(function(m){ return m.text; }).join('\n\n');
    root.innerHTML += '<div class="act' + (a.hot ? '' : ' calm') + '"><div class="h"><div class="pw"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg></div>' +
      '<div><div class="t">' + esc(a.t) + '</div><div class="w">' + esc(a.w) + '</div></div></div>' + people +
      '<details><summary>' + (a.msgs.length > 1 ? a.msgs.length + ' messages, written' : 'the message, written') + '</summary>' + body + '</details>' +
      '<textarea id="' + id + '" style="position:absolute;left:-9999px">' + esc(all) + '</textarea>' +
      '<div class="row"><button class="btn" data-copy="' + id + '">' + (a.msgs.length > 1 ? 'Copy all ' + a.msgs.length : 'Copy') + '</button><span class="nosend">nothing sends itself</span>' +
      (a.names.length > 1 ? '<span class="numbers">numbers are on the office system</span>' : '') + '<span class="flash" id="' + id + 'f">Copied</span></div></div>';
  });
  root.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var ta = document.getElementById(b.getAttribute('data-copy'));
      var done = function(){ var f = document.getElementById(ta.id + 'f'); f.classList.add('show'); setTimeout(function(){ f.classList.remove('show'); }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function(){ ta.select(); try{document.execCommand('copy');}catch(e){} done(); });
      else { ta.select(); try{document.execCommand('copy');}catch(e){} done(); }
    });
  });
}

function renderAll(){
  var items = gather();
  var when = DATA.captured_at || (DATA.overhead && DATA.overhead.generated_at);
  document.getElementById('topline').textContent = (LIVE ? 'read from the live system at ' : 'example data, captured ') + (when ? hhmm(when) : '');
  document.getElementById('dot').className = 'dot' + (LIVE ? ' on' : '');
  var known = DATA.overhead ? DATA.overhead.known_count+' of '+DATA.overhead.total_count : '';
  document.getElementById('lead').textContent = items.length + ' things worth your attention, ranked by money first and then by risk. ' + (known ? known + ' headline numbers can be answered today; the rest say what is missing and who captures it.' : '');
  renderActions(); renderKnow(items); renderMoney(); renderCalls(items.slice(0,5)); renderFleet(); renderBlind();
  document.getElementById('foot').textContent = LIVE
    ? 'Read from the office system. Every figure on this page comes from the same tables the department screens use, and nothing here was typed in by hand.'
    : 'This is the example, captured from the engine on ' + (when ? day(when) : '') + '. Opened on the office computer, the same page reads the live system and every figure is real.';
}

renderAll();

// Served by the hub, replace the island with the live answers. Same origin
// only; opened anywhere else the example stands and says so.
(function goLive(){
  if (!window.fetch || location.protocol === 'file:') return;
  var paths = { overhead:'/api/overhead', sources:'/api/sources', cockpit:'/api/cockpit', fleet:'/api/fleet', live:'/api/fleet/live', uninvoiced:'/api/finance/uninvoiced', decline:'/api/customers/decline', incidents:'/api/incidents', customers:'/api/customers?limit=500' };
  fetch(paths.overhead, {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(first){
    if (!first || !first.data || !first.data.metrics) return;
    var fresh = { captured_at: new Date().toISOString(), overhead: first.data };
    return Promise.all(Object.keys(paths).filter(function(k){return k!=='overhead';}).map(function(k){
      return fetch(paths[k], {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ fresh[k] = b && b.data || null; }).catch(function(){ fresh[k]=null; });
    })).then(function(){ DATA = fresh; LIVE = true; renderAll(); });
  }).catch(function(){});
})();
</script>

<script>

/* ---------- Brick 72: what the system did ---------- */
var DID_EXAMPLE = {"did": [{"at": "T-00:41", "kind": "did", "who": "by the system", "text": "Closed a trip the driver forgot to close, because the working day ended in Gaborone. No end odometer was taken and no parcel was touched."}, {"at": "T-01:10", "kind": "did", "who": "by a signed in person", "text": "A lead moved from quoted to lost, reason: price."}, {"at": "T-02:05", "kind": "did", "who": "by the system", "text": "Customer notices were drafted for an incident, 3 of them. None were sent by the system."}, {"at": "T-03:30", "kind": "did", "who": "by a signed in person", "text": "Proof of delivery was captured."}, {"at": "T-06:00", "kind": "did", "who": "by the system", "text": "Positions older than 90 days were deleted, as the driver policy promises."}], "skipped": [{"at": "T-06:00", "kind": "skipped", "who": "by the system", "text": "Fuel purchases were not read: nothing has ever been recorded there. Owner: whoever runs operations."}, {"at": "T-06:00", "kind": "skipped", "who": "by the system", "text": "Vehicle positions were not read: nothing new since the last trip closed. Owner: the driver app while a trip is open."}]};
function didTime(at){
  if (!at) return '';
  if (/^T-/.test(at)) { var m = at.slice(2).split(':'); var d = new Date(Date.now() - (Number(m[0])*60 + Number(m[1])) * 60000); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  var t = new Date(at); return isNaN(t) ? '' : ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
}
function renderDid(payload, isLive){
  var root = document.getElementById('did'); if (!root) return;
  var rows = (payload.did || []).concat(payload.skipped || []).map(function(r){ return Object.assign({}, r, {_t: r.at && /^T-/.test(r.at) ? -(Number(r.at.slice(2,4))*60+Number(r.at.slice(5))) : Date.parse(r.at) || 0}); });
  rows.sort(function(a,b){ return b._t - a._t; });
  var html = '<div class="didcard"><div class="h">What the system did' + (isLive ? '' : ', example') + '</div>';
  if (!rows.length) html += '<div class="didrow"><span class="t"></span><span class="x">Nothing has been recorded yet. That is not a quiet night, it is an empty log.</span></div>';
  rows.slice(0, 12).forEach(function(r){
    html += '<div class="didrow' + (r.kind === 'skipped' ? ' skip' : '') + '"><span class="t">' + esc(didTime(r.at)) + '</span><span class="x">' + esc(r.text) + '<span class="w">' + esc(r.who || '') + '</span></span></div>';
  });
  html += '<div class="didfoot">Every line is something the system did, or chose not to do and why. A thing it skipped is listed as loudly as a thing it did, because silence must never read as good news.</div></div>';
  root.innerHTML = html;
}
(function bootDid(){
  renderDid(DID_EXAMPLE, false);
  var h = location.hostname || '';
  var onHub = h === 'localhost' || h === '127.0.0.1' || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
  if (!onHub || !window.fetch || location.protocol === 'file:') return;
  fetch('/api/activity', { credentials: 'include' }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(b){ if (b && b.ok) renderDid(b.data, true); }).catch(function(){});
})();

</script>

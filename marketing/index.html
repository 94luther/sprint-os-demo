<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../shared/sprint-roles.js?v=daf3ad52"></script>
<link rel="stylesheet" href="../shared/sprint-allowed.css?v=c6953555">
<title>Marketing - Sprint Couriers</title>
<meta name="theme-color" content="#131311">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../shared/app-icon-192.png">
<link rel="apple-touch-icon" href="../shared/app-icon-180.png">
<style>
/* Local first brand type. It never phones home to Google, and it never
   breaks when there is no internet or no signal on a driver phone. Drop
   the two real font files into apps/shared/fonts/ to restore the exact
   brand type offline; see the README there. With no files present this
   falls back to the system font stack below. */
@font-face{font-family:'Anton'; font-weight:400; font-display:swap;
  src:local('Anton'), url('../shared/fonts/Anton-Regular.woff2') format('woff2'), url('../shared/fonts/Anton-Regular.ttf') format('truetype');}
@font-face{font-family:'Inter'; font-weight:100 900; font-display:swap;
  src:local('Inter'), url('../shared/fonts/Inter-Variable.woff2') format('woff2'), url('../shared/fonts/Inter-Variable.ttf') format('truetype');}
:root{
  --font-display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --ink:#131311; --panel:#1d1d19; --line:#2c2c27; --bone:#F4F4F1; --dim:#a6a69f;
  --green:#3AAA35; --orange:#F7941D; --red:#e0483e;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; max-width:100%; overflow-x:hidden;}
body{
  background:var(--ink); color:var(--bone); font-family:var(--font-body);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
h1,h2,h3,.disp{font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.01em; font-weight:400;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--orange); color:var(--ink);}

header{
  position:sticky; top:0; z-index:20; background:var(--ink);
  border-bottom:1px solid var(--line); padding:10px 14px;
  display:flex; align-items:center; gap:10px;
}
header img{width:32px; height:32px; object-fit:contain; flex:none;}
header .titles{flex:1; min-width:0;}
header h1{font-size:15px; line-height:1.1;}
header .who{font-size:11px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sync-badge{
  font-size:10px; padding:4px 8px; border-radius:20px; border:1px solid var(--line);
  color:var(--dim); flex:none; display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.sync-dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex:none;}
.sync-badge.offline .sync-dot{background:var(--orange);}
.sync-badge.offline{color:var(--orange); border-color:var(--orange);}

main{max-width:860px; margin:0 auto; padding:12px 14px 40px;}
.banner-example{
  background:rgba(247,148,29,0.12); border:1px solid var(--orange); color:var(--orange);
  font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:12px;
}
.banner-stale{
  background:var(--panel); border:1px solid var(--line); color:var(--dim);
  font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:12px;
}
section{margin-bottom:26px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px;}
.section-head h2{font-size:14px; color:var(--dim); letter-spacing:0.06em; min-width:0;}
.section-head .hint{font-size:11px; color:var(--dim); min-width:0; text-align:right; flex-shrink:1;}

/* calendar */
.week-label{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin:14px 0 6px;}
.week-label:first-child{margin-top:0;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-cell{background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 5px; min-height:82px; font-size:9.5px;}
.cal-cell.today{border-color:var(--green);}
.cal-date{font-size:10px; color:var(--dim); font-weight:700; margin-bottom:4px;}
.cal-tag{display:block; background:var(--ink); border-radius:4px; padding:2px 4px; margin-bottom:3px; color:var(--dim); line-height:1.3;}
.cal-tag.camp{background:rgba(58,170,53,0.18); color:var(--green); font-weight:600;}
.cal-tag.pulse{background:rgba(58,170,53,0.22); color:var(--green); font-weight:700;}

/* asset library */
.asset-row{margin-bottom:10px;}
.asset-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
.asset-name{font-weight:600;}
.asset-count{color:var(--dim);}
.bar{position:relative; height:16px; background:var(--line); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; border-radius:4px; background:var(--green);}
.asset-link{
  display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; font-size:12px; margin-top:6px; text-decoration:none; color:var(--bone);
}
.asset-link span.tag{color:var(--dim); font-size:10.5px;}

/* attribution */
.attr-row{margin-bottom:12px;}
.attr-top{font-size:12.5px; font-weight:600; margin-bottom:4px;}
.attr-pair{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
.attr-pair .lbl{width:64px; font-size:10px; color:var(--dim); flex:none;}
.attr-pair .bar{flex:1;}
.attr-pair .val{width:34px; text-align:right; font-size:11px; color:var(--dim); flex:none;}
.attr-pair.replied .bar-fill{background:var(--bone); opacity:0.65;}

/* guard box */
.guard-box{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px;}
.guard-line{font-size:12px; color:var(--dim); margin-bottom:10px; line-height:1.4;}
.guard-line b{color:var(--bone); font-weight:600;}
.guard-fields{display:flex; flex-direction:column; gap:8px;}
select,input[type=text]{
  background:var(--ink); border:1px solid var(--line); color:var(--bone); border-radius:6px;
  padding:9px 10px; font-size:13px; font-family:inherit; width:100%;
}
.btn{
  background:var(--green); color:var(--ink); border:none; border-radius:6px; font-weight:700;
  padding:10px 12px; font-size:12.5px; cursor:pointer; text-transform:uppercase; letter-spacing:0.03em;
}
.btn.orange{background:var(--orange);}
.btn:disabled{opacity:0.5; cursor:default;}
.guard-result{margin-top:10px; font-size:13px; padding:9px 10px; border-radius:6px; display:none;}
.guard-result.clear{display:block; background:rgba(58,170,53,0.16); color:var(--green); font-weight:700;}
.guard-result.wait{display:block; background:rgba(224,72,62,0.16); color:var(--red); font-weight:700;}
.guard-result .sub{display:block; font-weight:400; color:var(--dim); font-size:11px; margin-top:3px;}

.empty-note{font-size:12px; color:var(--dim); padding:10px 4px;}

/* login */
.login-wrap{max-width:320px; margin:18vh auto 0; padding:0 20px;}
.login-wrap h1{font-size:22px; margin-bottom:4px;}
.login-wrap p{font-size:12px; color:var(--dim); margin-bottom:18px;}
.login-wrap form{display:flex; flex-direction:column; gap:10px;}
.login-hint{font-size:11px; color:var(--dim); margin-top:14px; line-height:1.5;}
.err{color:var(--red); font-size:12px; margin-top:6px; display:none;}

@media(min-width:640px){
  main{padding:18px 24px 40px;}
  .cal-cell{min-height:64px; font-size:10.5px;}
  .guard-fields{flex-direction:row;}
}

/* Brick 61: the bell, same on every page */
.hdr-bell{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none;margin-left:8px}
.hdr-bell svg{width:18px;height:18px;stroke:#F4F7F5;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<link rel="stylesheet" href="../shared/sprint-theme.css?v=d22384bc">
</head>
<body>

<header>
  <img src="../shared/logo-mark.png" alt="Sprint Couriers">
  <div class="titles">
    <h1>Marketing</h1>
    <div class="who" id="whoLine">Not signed in</div>
  </div>
  <span class="hdr-bell" id="bell" title="What needs you"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
  <div class="sync-badge" id="syncBadge"><span class="sync-dot"></span><span id="syncText">Loading</span></div>
</header>

<main id="app">
  <div style="padding:40px 4px; color:var(--dim); font-size:13px;">Loading Marketing...</div>
</main>

<div class="login-wrap" id="loginWrap" style="display:none;">
  <h1>Sign in</h1>
  <p>Sprint Couriers staff PIN</p>
  <form id="loginForm">
    <input type="text" id="staffId" placeholder="Staff ID" autocomplete="username" required>
    <input type="text" inputmode="numeric" pattern="[0-9]*" id="pin" placeholder="PIN" maxlength="8" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
  <div class="login-hint">Signing in works on the office computer. On a phone, tap View example data instead.<br>Or continue offline below with example data.</div>
  <button class="btn" style="margin-top:10px;width:100%;background:none;border:1px solid var(--line);color:var(--bone);" id="offlineBtn">View example data instead</button>
</div>

<script>
/* ---------- helpers ---------- */
function pula(thebe){
  const p = (Number(thebe||0)/100);
  const parts = p.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return 'P' + parts.join('.');
}
function localDT(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString('en-GB',{timeZone:'Africa/Gaborone',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function gaboroneDateStr(d){
  d = d || new Date();
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Gaborone',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- state ---------- */
let ME = null;
let DATA = null;
let SYNCED_AT = null;
const CACHE_KEY = 'sprintos_marketing_cache_v1';

/* ---------- static asset library index (spec numbers) ---------- */
const ASSETS = [
  {name:'Videos', location:'remotion-video\\out', count:56},
  {name:'Graphics', location:'SprintDaily', count:36},
  {name:'Games', location:'arcade', count:3},
  {name:'Arcade experience', location:'brand-arcade', count:1},
];
const BLUEPRINT_LINK = 'https://claude.ai/code/artifact/61902a7f-5c4d-4127-8d6a-6ffae3138dc6';

/* ---------- example data ---------- */
function shiftDate(days){ const d = new Date(); d.setUTCDate(d.getUTCDate()+days); return d.toISOString(); }
const EXAMPLE = {
  campaigns: [
    {id:'c1', name:'Cold chain corridor push', channel:'email', started_at: shiftDate(-3)},
    {id:'c2', name:'Corporate accounts follow up', channel:'email', started_at: shiftDate(1)},
    {id:'c3', name:'Tender network outreach', channel:'email', started_at: shiftDate(5)},
  ],
  attribution: [
    {name:'Cold chain corridor push', touched:34, replied:9},
    {name:'Corporate accounts follow up', touched:52, replied:14},
    {name:'Tender network outreach', touched:18, replied:2},
  ],
  customers: ['EXAMPLE Kalahari Meats','EXAMPLE Sunrise Pharmacy Group','EXAMPLE Tlokweng Hardware','EXAMPLE Boteti Mining Supplies']
};

/* ---------- api ---------- */
async function apiFetch(path, opts){
  const res = await fetch(path, Object.assign({credentials:'include', headers:{'Content-Type':'application/json'}}, opts));
  let json;
  try{ json = await res.json(); } catch(e){ json = {ok:false, error:'Bad response'}; }
  if(res.status === 401){ const err = new Error('unauthorized'); err.auth = true; throw err; }
  if(!json.ok){ const err = new Error(json.error || ('HTTP '+res.status)); err.status = res.status; throw err; }
  return json.data;
}

async function boot(){
  /* phone copy: not served by the office hub, so there is nothing to sign in to.
     Go straight to the example rather than showing a login screen that cannot work. */
  var __h = (location.hostname || '');
  var __onHub = __h === 'localhost' || __h === '127.0.0.1' || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(__h);
  if (!__onHub) { loadFallback(); return; }

  try{
    const me = await apiFetch('/api/me');
    if(!me){ showLogin(); return; }
    ME = me;
    document.getElementById('whoLine').textContent = ME.name + ' - ' + ME.role;
    await loadLive();
  }catch(e){ loadFallback(); }
}
async function loadLive(){
  try{
    const [campaigns, leads, interactions, customers] = await Promise.all([
      apiFetch('/api/campaigns?limit=100'),
      apiFetch('/api/leads?limit=500'),
      apiFetch('/api/interactions?limit=500'),
      apiFetch('/api/customers?limit=500'),
    ]);
    DATA = {campaigns, leads, interactions, customers, live:true};
    SYNCED_AT = new Date().toISOString();
    localStorage.setItem(CACHE_KEY, JSON.stringify({data:DATA, at:SYNCED_AT}));
    render();
  }catch(e){ loadFallback(); }
}
function loadFallback(){
  const cached = localStorage.getItem(CACHE_KEY);
  if(cached){
    try{
      const parsed = JSON.parse(cached);
      DATA = parsed.data; DATA.live = false; DATA.cached = true;
      SYNCED_AT = parsed.at;
      render(); return;
    }catch(e){}
  }
  DATA = {example:true};
  SYNCED_AT = null;
  render();
}
function showLogin(){
  document.getElementById('app').innerHTML = '';
  document.getElementById('loginWrap').style.display = 'block';
  document.getElementById('syncText').textContent = 'Sign in';
}
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const staffId = document.getElementById('staffId').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  try{
    await apiFetch('/api/login', {method:'POST', body:JSON.stringify({staffId, pin})});
    document.getElementById('loginWrap').style.display = 'none';
    await boot();
  }catch(err){
    errEl.textContent = 'Could not sign in. Check the staff ID and PIN.';
    errEl.style.display = 'block';
  }
});
document.getElementById('offlineBtn').addEventListener('click', ()=>{
  document.getElementById('loginWrap').style.display = 'none';
  loadFallback();
});

function updateSyncBadge(){
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncText');
  badge.classList.remove('offline');
  if(DATA && DATA.example){ badge.classList.add('offline'); text.textContent = 'Offline'; }
  else if(DATA && DATA.live){ text.textContent = 'Synced now'; }
  else if(SYNCED_AT){ badge.classList.add('offline'); text.textContent = 'Synced ' + localDT(SYNCED_AT); }
  else { badge.classList.add('offline'); text.textContent = 'Offline'; }
}

/* ---------- calendar ---------- */
const RECURRING_WEEKDAY = [
  {tag:'Feed 08:09', cls:'camp'}, {tag:'Story 08:09', cls:'camp'}
];
function buildWeek(mondayDate){
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(mondayDate);
    d.setUTCDate(d.getUTCDate()+i);
    days.push(d);
  }
  return days;
}
function mondayOf(date){
  const d = new Date(date);
  const day = d.getUTCDay(); // 0 sun .. 6 sat
  const diff = (day===0? -6 : 1-day);
  d.setUTCDate(d.getUTCDate()+diff);
  d.setUTCHours(0,0,0,0);
  return d;
}
function renderCalendar(){
  const campaigns = DATA.example ? EXAMPLE.campaigns : (DATA.campaigns||[]);
  const today = new Date();
  const thisMonday = mondayOf(today);
  const nextMonday = new Date(thisMonday); nextMonday.setUTCDate(nextMonday.getUTCDate()+7);
  const weeks = [{label:'This week', days:buildWeek(thisMonday)}, {label:'Next week', days:buildWeek(nextMonday)}];
  const todayStr = gaboroneDateStr(today);
  const DOWN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = '';
  weeks.forEach(w=>{
    html += '<div class="week-label">'+w.label+'</div><div class="cal-grid">';
    w.days.forEach((d, i)=>{
      const dStr = gaboroneDateStr(d);
      const isToday = dStr === todayStr;
      const isWeekday = i < 5;
      let tags = '';
      if(isWeekday) RECURRING_WEEKDAY.forEach(r=> tags += '<span class="cal-tag '+r.cls+'">'+r.tag+'</span>');
      if(i === 4) tags += '<span class="cal-tag pulse">Week Pulse</span>'; // Friday
      campaigns.forEach(c=>{
        if(!c.started_at) return;
        if(gaboroneDateStr(new Date(c.started_at)) === dStr) tags += '<span class="cal-tag">'+esc(c.name)+'</span>';
      });
      html += '<div class="cal-cell '+(isToday?'today':'')+'"><div class="cal-date">'+DOWN[i]+' '+d.getUTCDate()+'</div>'+tags+'</div>';
    });
    html += '</div>';
  });
  return html;
}

/* ---------- asset library ---------- */
function renderAssets(){
  const max = Math.max(...ASSETS.map(a=>a.count));
  let html = ASSETS.map(a=>{
    const pct = Math.max(4, Math.round(a.count/max*100));
    return '<div class="asset-row"><div class="asset-top"><span class="asset-name">'+esc(a.name)+'</span><span class="asset-count">'+a.count+'</span></div>'+
      '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');
  html += '<a class="asset-link" href="'+BLUEPRINT_LINK+'" target="_blank" rel="noopener">'+
    '<span>Delivery platform blueprint</span><span class="tag">open artifact &rarr;</span></a>';
  return html;
}

/* ---------- attribution ---------- */
function computeAttribution(){
  if(DATA.example) return EXAMPLE.attribution;
  const campaigns = DATA.campaigns||[];
  const leads = DATA.leads||[];
  if(!campaigns.length || !leads.length) return null;
  const rows = campaigns.map(c=>{
    const touched = leads.filter(l => l.source && c.name && l.source.toLowerCase().includes(c.name.toLowerCase().split(' ')[0]));
    const replied = touched.filter(l => ['replied','meeting','quoted','won'].includes(l.stage));
    return {name:c.name, touched: touched.length, replied: replied.length};
  });
  const anyTouched = rows.some(r=>r.touched>0);
  return anyTouched ? rows : null;
}
function renderAttribution(){
  let rows = computeAttribution();
  let note = '';
  if(!rows){ rows = EXAMPLE.attribution; note = '<div class="empty-note">Example data. The hub does not yet link leads to the campaign that touched them by name.</div>'; }
  const max = Math.max(1, ...rows.map(r=>Math.max(r.touched, r.replied)));
  let html = note;
  rows.forEach(r=>{
    html += '<div class="attr-row"><div class="attr-top">'+esc(r.name)+'</div>'+
      '<div class="attr-pair"><span class="lbl">Touched</span><div class="bar"><div class="bar-fill" style="width:'+Math.max(4,Math.round(r.touched/max*100))+'%"></div></div><span class="val">'+r.touched+'</span></div>'+
      '<div class="attr-pair replied"><span class="lbl">Replied</span><div class="bar"><div class="bar-fill" style="width:'+Math.max(4,Math.round(r.replied/max*100))+'%"></div></div><span class="val">'+r.replied+'</span></div>'+
    '</div>';
  });
  return html;
}

/* ---------- cross campaign guard ---------- */
function renderGuardBox(){
  const campaigns = DATA.example ? EXAMPLE.campaigns : (DATA.campaigns||[]);
  const customers = DATA.example ? EXAMPLE.customers.map((n,i)=>({id:'ex'+i, name:n})) : (DATA.customers||[]);
  return '<div class="guard-box">'+
    '<div class="guard-line"><b>No customer hears from Sprint twice within 4 days.</b> This checks the guard and records a touch, it does not send anything.</div>'+
    '<div class="guard-fields">'+
      '<select id="guardCampaign">'+campaigns.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select>'+
      '<input list="guardCustomers" id="guardCustomer" type="text" placeholder="Customer name">'+
      '<datalist id="guardCustomers">'+customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist>'+
      '<button class="btn orange" onclick="checkGuard()">Record a touch</button>'+
    '</div>'+
    '<div class="guard-result" id="guardResult"></div>'+
  '</div>';
}
async function checkGuard(){
  const campaignId = document.getElementById('guardCampaign').value;
  const name = document.getElementById('guardCustomer').value.trim();
  const resultEl = document.getElementById('guardResult');
  resultEl.className = 'guard-result'; resultEl.style.display='none';
  if(!name){ return; }
  if(DATA.example){
    const wait = Math.random() < 0.35;
    resultEl.className = 'guard-result ' + (wait ? 'wait' : 'clear');
    resultEl.innerHTML = wait ? 'WAIT<span class="sub">Example data: this customer was touched within the last 4 days.</span>' : 'CLEAR<span class="sub">Example data: safe to reach out.</span>';
    return;
  }
  const cust = (DATA.customers||[]).find(c=>c.name.toLowerCase()===name.toLowerCase());
  if(!cust){ resultEl.className='guard-result wait'; resultEl.innerHTML = 'No match<span class="sub">No customer found with that exact name.</span>'; return; }
  try{
    await apiFetch('/api/campaigns/'+campaignId+'/touch', {method:'POST', body:JSON.stringify({customer_id:cust.id})});
    resultEl.className = 'guard-result clear';
    resultEl.innerHTML = 'CLEAR<span class="sub">Touch recorded just now.</span>';
  }catch(e){
    resultEl.className = 'guard-result wait';
    const m = /within the last 4 days\.?/.test(e.message) ? e.message : e.message;
    resultEl.innerHTML = 'WAIT<span class="sub">'+esc(m)+'</span>';
  }
}

/* ---------- render ---------- */
function render(){
  updateSyncBadge();
  const html = [];
  if(DATA.example){
    html.push('<div class="banner-example">EXAMPLE DATA. Every company, tender, parcel and number on this screen is invented to show how the screen works.</div>');
  } else if(!DATA.live){
    html.push('<div class="banner-stale">Showing last synced data from ' + localDT(SYNCED_AT) + '. Hub unreachable now.</div>');
  }

  html.push('<section><div class="section-head"><h2>Content calendar</h2><span class="hint">this week and next</span></div>'+renderCalendar()+'</section>');
  html.push('<section><div class="section-head"><h2>Asset library</h2><span class="hint">what already exists</span></div>'+renderAssets()+'</section>');
  html.push('<section><div class="section-head"><h2>Campaign to reply attribution</h2><span class="hint">touched vs replied</span></div>'+renderAttribution()+'</section>');
  html.push('<section><div class="section-head"><h2>Cross campaign guard</h2></div>'+renderGuardBox()+'</section>');

  document.getElementById('app').innerHTML = html.join('');
}

boot();
